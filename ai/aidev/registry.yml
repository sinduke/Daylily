public_api:
  Daylily:
    exports:
      - DaylilyCore
      - DaylilyJSON
      - DaylilyNIO
      - DaylilyObservability
      - DaylilyOpenAPI
    Application.run:
      signatures:
        - "public func run(host: String = \"127.0.0.1\", port: Int = 8080) async throws"
        - "public func run(configuration: ServerConfiguration) async throws"
      parameters:
        host: "bind host"
        port: "bind port"
        configuration: "explicit server configuration"
    macros:
      DaylilyServer:
        signature: "public macro DaylilyServer()"
        role: "generate static main and Application route registration"
      GET:
        signature: "public macro GET(_ path: String)"
        role: "mark instance method as GET route"
      POST:
        signature: "public macro POST(_ path: String)"
        role: "mark instance method as POST route"
      PUT:
        signature: "public macro PUT(_ path: String)"
        role: "mark instance method as PUT route"
      PATCH:
        signature: "public macro PATCH(_ path: String)"
        role: "mark instance method as PATCH route"
      DELETE:
        signature: "public macro DELETE(_ path: String)"
        role: "mark instance method as DELETE route"
      HEAD:
        signature: "public macro HEAD(_ path: String)"
        role: "mark instance method as HEAD route"
      OPTIONS:
        signature: "public macro OPTIONS(_ path: String)"
        role: "mark instance method as OPTIONS route"
      GROUP:
        signature: "public macro GROUP(_ prefix: String)"
        role: "mark nested struct as route group"
  DaylilyObservability:
    RequestLog:
      kind: struct
      conforms:
        - Equatable
        - Sendable
      properties:
        - "method: HTTPMethod"
        - "path: String"
        - "status: Status"
        - "requestID: String?"
        - "correlationID: String?"
        - "durationNanoseconds: UInt64?"
        - "errorReason: String?"
      initializer: "public init(method: HTTPMethod, path: String, status: Status, requestID: String? = nil, correlationID: String? = nil, durationNanoseconds: UInt64? = nil, errorReason: String? = nil)"
    RequestIDGenerator:
      kind: typealias
      signature: "public typealias RequestIDGenerator = @Sendable () -> String"
    RequestIDHeaders:
      kind: enum
      constants:
        - "requestID = x-request-id"
        - "daylilyRequestID = x-daylily-request-id"
    RequestIDs:
      kind: enum
      methods:
        - "public static func generate() -> String"
    RequestIDMiddleware:
      kind: struct
      conforms:
        - Middleware
      initializer: "public init(generator: @escaping RequestIDGenerator = RequestIDs.generate)"
      contract: "Generates a Daylily-owned request ID, preserves external x-request-id as correlation data, and writes response ID headers."
    RequestLogSink:
      kind: protocol
      conforms:
        - Sendable
      methods:
        - "func record(_ log: RequestLog) async"
    RequestLoggingMiddleware:
      kind: struct
      generic: "Sink: RequestLogSink"
      conforms:
        - Middleware
      initializer: "public init(sink: Sink)"
      contract: "Records method, path, final status, request ID, external correlation ID, duration, and public error reason around downstream middleware/handler execution."
    ConsoleRequestLogSink:
      kind: struct
      conforms:
        - RequestLogSink
      methods:
        - "public init()"
        - "public func record(_ log: RequestLog) async"
    InMemoryRequestLogSink:
      kind: actor
      conforms:
        - RequestLogSink
      methods:
        - "public init()"
        - "public func record(_ log: RequestLog)"
        - "public func snapshot() -> [RequestLog]"
  DaylilyOpenAPI:
    OpenAPIDocument:
      kind: struct
      conforms:
        - Codable
        - Equatable
        - Sendable
      properties:
        - "openapi: String"
        - "info: OpenAPIInfo"
        - "paths: [String: [String: OpenAPIOperation]]"
    OpenAPIInfo:
      kind: struct
      conforms:
        - Codable
        - Equatable
        - Sendable
      properties:
        - "title: String"
        - "version: String"
    OpenAPIOperation:
      kind: struct
      conforms:
        - Codable
        - Equatable
        - Sendable
      properties:
        - "summary: String?"
        - "description: String?"
        - "operationID: String?"
        - "tags: [String]"
        - "parameters: [OpenAPIParameter]"
        - "requestBody: OpenAPIRequestBody?"
        - "responses: [String: OpenAPIResponse]"
    OpenAPIParameter:
      kind: struct
      conforms:
        - Codable
        - Equatable
        - Sendable
      properties:
        - "name: String"
        - "location: String"
        - "required: Bool"
        - "schema: OpenAPISchema"
      coding:
        location: "in"
    OpenAPIRequestBody:
      kind: struct
      conforms:
        - Codable
        - Equatable
        - Sendable
      properties:
        - "required: Bool"
        - "content: [String: OpenAPIMediaType]"
    OpenAPIResponse:
      kind: struct
      conforms:
        - Codable
        - Equatable
        - Sendable
      properties:
        - "description: String"
        - "content: [String: OpenAPIMediaType]?"
    OpenAPIMediaType:
      kind: struct
      conforms:
        - Codable
        - Equatable
        - Sendable
      properties:
        - "schema: OpenAPISchema"
    OpenAPISchema:
      kind: struct
      conforms:
        - Codable
        - Equatable
        - Sendable
      properties:
        - "type: String"
        - "format: String?"
        - "swiftType: String?"
      coding:
        swiftType: "x-swift-type"
    OpenAPIBuilder:
      kind: struct
      conforms:
        - Sendable
      methods:
        - "public init()"
        - "public func document(for routes: [RouteDescription], title: String, version: String, openapi: String = \"3.1.0\") -> OpenAPIDocument"
    Application_openAPI:
      kind: extension_method
      signature: "public func openAPI(title: String, version: String, openapi: String = \"3.1.0\") -> OpenAPIDocument"
      contract: "Builds a minimal OpenAPI document from Application.describeRoutes()."
  DaylilyTesting:
    TestClient:
      kind: struct
      conforms:
        - Sendable
      methods:
        - "public init(_ application: Application)"
        - "public func respond(to request: Request) async throws -> Response"
        - "public func send(_ request: TestRequest) async throws -> Response"
        - "public func get(_ path: String, headers: Headers = [:]) async throws -> Response"
        - "public func post(_ path: String, headers: Headers = [:], body: Body = .bytes([])) async throws -> Response"
        - "public func post(_ path: String, headers: Headers = [:], body: [UInt8]) async throws -> Response"
        - "public func post(_ path: String, headers: Headers = [:], body: String) async throws -> Response"
        - "public func postJSON<Value: Encodable>(_ path: String, headers: Headers = [:], body value: Value) async throws -> Response"
        - "public func put(_ path: String, headers: Headers = [:], body: Body = .bytes([])) async throws -> Response"
        - "public func put(_ path: String, headers: Headers = [:], body: [UInt8]) async throws -> Response"
        - "public func put(_ path: String, headers: Headers = [:], body: String) async throws -> Response"
        - "public func patch(_ path: String, headers: Headers = [:], body: Body = .bytes([])) async throws -> Response"
        - "public func patch(_ path: String, headers: Headers = [:], body: [UInt8]) async throws -> Response"
        - "public func patch(_ path: String, headers: Headers = [:], body: String) async throws -> Response"
        - "public func delete(_ path: String, headers: Headers = [:]) async throws -> Response"
        - "public func head(_ path: String, headers: Headers = [:]) async throws -> Response"
        - "public func options(_ path: String, headers: Headers = [:]) async throws -> Response"
      contract: "Transport-free in-memory test client that calls Application.respond(to:) directly."
    TestRequest:
      kind: struct
      conforms:
        - Sendable
      properties:
        - "method: HTTPMethod"
        - "path: String"
        - "headers: Headers"
        - "body: Body"
      factories:
        - "public static func get(_ path: String, headers: Headers = [:]) -> TestRequest"
        - "public static func post(_ path: String, headers: Headers = [:], body: Body = .bytes([])) -> TestRequest"
        - "public static func put(_ path: String, headers: Headers = [:], body: Body = .bytes([])) -> TestRequest"
        - "public static func patch(_ path: String, headers: Headers = [:], body: Body = .bytes([])) -> TestRequest"
        - "public static func delete(_ path: String, headers: Headers = [:]) -> TestRequest"
        - "public static func head(_ path: String, headers: Headers = [:]) -> TestRequest"
        - "public static func options(_ path: String, headers: Headers = [:]) -> TestRequest"
      methods:
        - "public func withHeader(_ name: String, _ value: String) -> TestRequest"
        - "public func withBody(_ body: Body) -> TestRequest"
        - "public func withBody(_ bytes: [UInt8]) -> TestRequest"
        - "public func withBody(_ string: String) -> TestRequest"
        - "public func withJSON<Value: Encodable>(_ value: Value) throws -> TestRequest"
        - "public func toRequest() -> Request"
      contract: "Small immutable-style builder for in-memory Daylily Request values."
    TestFailure:
      kind: enum
      conforms:
        - Error
        - Sendable
        - CustomStringConvertible
      cases:
        - "status(expected: Status, actual: Status)"
        - "body(expected: String, actual: String)"
        - "json(reason: String)"
    Response_testing_helpers:
      kind: extension_methods
      methods:
        - "public func json<Value: Decodable>(_ type: Value.Type = Value.self) throws -> Value"
        - "public func requireStatus(_ expected: Status) throws"
        - "public func requireBody(_ expected: String) throws"
        - "public func requireJSON<Value: Decodable & Equatable>(_ expected: Value, as type: Value.Type = Value.self) throws"
      contract: "Testing-only response decode and assertion helpers in DaylilyTesting."
  DaylilyCore:
    Application:
      kind: struct
      conforms:
        - Sendable
      methods:
        - "public init(@RouteBuilder routes: () -> [Route])"
        - "public init(routes: [Route])"
        - "public init(routes: Routes)"
        - "public func middleware<M: Middleware>(_ middleware: M) -> Application"
        - "public func lifecycle(_ phase: LifecyclePhase, _ operation: @escaping LifecycleOperation) -> Application"
        - "public func configure(_ operation: @escaping LifecycleOperation) -> Application"
        - "public func boot(_ operation: @escaping LifecycleOperation) -> Application"
        - "public func started(_ operation: @escaping LifecycleOperation) -> Application"
        - "public func shutdown(_ operation: @escaping LifecycleOperation) -> Application"
        - "public func cleanup(_ operation: @escaping LifecycleOperation) -> Application"
        - "public func runLifecycle(_ phase: LifecyclePhase) async throws"
        - "public func describeRoutes() -> [RouteDescription]"
        - "public func respond(to request: Request) async -> Response"
      contract: "Always returns a Response; runs application middleware around router dispatch; converts ResponseError and unknown errors; lifecycle hooks are explicit and not run by respond(to:); describeRoutes exposes route metadata without invoking handlers."
    LifecyclePhase:
      kind: enum
      conforms:
        - Sendable
        - CaseIterable
      cases:
        - configure
        - boot
        - started
        - shutdown
        - cleanup
    LifecycleOperation:
      kind: typealias
      signature: "public typealias LifecycleOperation = @Sendable () async throws -> Void"
    HTTPMethod:
      kind: enum
      conforms:
        - Sendable
      cases:
        - "delete = DELETE"
        - "get = GET"
        - "head = HEAD"
        - "options = OPTIONS"
        - "patch = PATCH"
        - "post = POST"
        - "put = PUT"
      initializer: "public init?(_ rawValue: String)"
      contract: "Parses supported HTTP methods case-insensitively."
    RouteDSL:
      kind: functions
      functions:
        - "Get(_:_:)"
        - "Post(_:_:)"
        - "Put(_:_:)"
        - "Patch(_:_:)"
        - "Delete(_:_:)"
        - "Head(_:_:)"
        - "Options(_:_:)"
        - "Group(_:routes:)"
      contract: "Each verb function has zero-parameter and Request-parameter async handler overloads that return Route."
    ServerConfiguration:
      kind: struct
      conforms:
        - Equatable
        - Sendable
      properties:
        - "host: String"
        - "port: Int"
        - "backlog: Int"
        - "reuseAddress: Bool"
        - "maxMessagesPerRead: Int"
        - "gracefulShutdownSignals: Bool"
      initializer: "public init(host: String = \"127.0.0.1\", port: Int = 8080, backlog: Int = 256, reuseAddress: Bool = true, maxMessagesPerRead: Int = 16, gracefulShutdownSignals: Bool = true)"
      contract: "NIO-free configuration consumed by Application.run(configuration:)."
    Route:
      kind: struct
      conforms:
        - Sendable
      properties:
        - "method: HTTPMethod"
        - "path: String"
        - "handler: Handler"
        - "metadata: RouteMetadata"
      methods:
        - "public func prefixed(with prefix: String) -> Route"
        - "public func middleware<M: Middleware>(_ middleware: M) -> Route"
        - "public func withMetadata(_ metadata: RouteMetadata) -> Route"
        - "public func describe(summary:description:tags:operationID:inputs:requestBody:responses:) -> Route"
      contract: "Normalizes paths and stores route handler, route middleware, and route metadata."
    RouteMetadata:
      kind: struct
      conforms:
        - Equatable
        - Sendable
      properties:
        - "summary: String?"
        - "description: String?"
        - "tags: [String]"
        - "operationID: String?"
        - "inputs: [RouteInputMetadata]"
        - "requestBody: RouteBodyMetadata?"
        - "responses: [RouteResponseMetadata]"
      contract: "Runtime-owned descriptive metadata for OpenAPI generation."
    RouteInputLocation:
      kind: enum
      conforms:
        - Equatable
        - Sendable
      cases:
        - path
        - query
        - header
    RouteInputMetadata:
      kind: struct
      conforms:
        - Equatable
        - Sendable
      properties:
        - "location: RouteInputLocation"
        - "name: String"
        - "typeName: String"
        - "required: Bool"
      factories:
        - "path(_:type:required:)"
        - "query(_:type:required:)"
        - "header(_:type:required:)"
    RouteBodyMetadata:
      kind: struct
      conforms:
        - Equatable
        - Sendable
      properties:
        - "contentType: String"
        - "typeName: String"
        - "required: Bool"
      factories:
        - "json(_:required:)"
    RouteResponseMetadata:
      kind: struct
      conforms:
        - Equatable
        - Sendable
      properties:
        - "status: Status"
        - "contentType: String?"
        - "typeName: String?"
      factories:
        - "response(_:contentType:type:)"
    RouteDescription:
      kind: struct
      conforms:
        - Equatable
        - Sendable
      properties:
        - "method: HTTPMethod"
        - "path: String"
        - "metadata: RouteMetadata"
    Routes:
      kind: struct
      conforms:
        - Sendable
      methods:
        - "public func middleware<M: Middleware>(_ middleware: M) -> Routes"
      contract: "Group route collection wrapper accepted by RouteBuilder; resolves group middleware before route middleware."
    Middleware:
      kind: protocol
      conforms:
        - Sendable
      methods:
        - "func handle(_ request: Request, next: Handler) async throws -> Response"
      contract: "Middleware can inspect Request, call next, transform Response, short-circuit, or throw."
    Request:
      kind: struct
      conforms:
        - Sendable
      properties:
        - "method: HTTPMethod"
        - "path: String"
        - "headers: Headers"
        - "body: Body"
        - "parameters: Parameters"
        - "query: QueryParameters"
      methods:
        - "public init(method:path:headers:body: Body = .bytes([]), parameters: Parameters = Parameters(), query: QueryParameters? = nil)"
        - "public init(method:path:headers:body: [UInt8], parameters: Parameters = Parameters(), query: QueryParameters? = nil)"
        - "public func with(parameters: Parameters) -> Request"
        - "public func with(body: Body) -> Request"
        - "public func with(headers: Headers) -> Request"
        - "public func withBufferedBody<R: Sendable>(upTo limit: ByteCount, _ operation: @Sendable (Request, [UInt8]) async throws -> R) async throws -> R"
      contract: "Request initializers strip query text from path and populate query; DaylilyNIO creates streaming Body values through transport SPI; in-process callers may use Body.bytes(...); request copying helpers preserve one-shot body storage; explicit body buffering uses withBufferedBody(upTo:_:)."
    Parameters:
      kind: struct
      conforms:
        - Equatable
        - Sendable
      methods:
        - "public init(_ storage: [String: String] = [:])"
        - "public subscript(_ name: String) -> String? { get }"
        - "public subscript(dynamicMember name: String) -> String? { get }"
        - "public func require<Value: ParameterDecodable>(_ name: String, as type: Value.Type = Value.self) throws -> Value"
        - "public func get<Value: ParameterDecodable>(_ name: String, as type: Value.Type = Value.self) throws -> Value?"
      contract: "Untyped path lookup returns optional String; typed lookup throws ParameterError for missing required or invalid values."
    QueryParameters:
      kind: struct
      conforms:
        - Equatable
        - Sendable
      methods:
        - "public init(_ storage: [String: String] = [:])"
        - "public subscript(_ name: String) -> String? { get }"
        - "public subscript(dynamicMember name: String) -> String? { get }"
        - "public func require<Value: ParameterDecodable>(_ name: String, as type: Value.Type = Value.self) throws -> Value"
        - "public func get<Value: ParameterDecodable>(_ name: String, as type: Value.Type = Value.self) throws -> Value?"
      contract: "Untyped query lookup returns optional String; typed lookup throws QueryParameterError for missing required or invalid values."
    Headers:
      kind: struct
      conforms:
        - Equatable
        - Sendable
        - ExpressibleByDictionaryLiteral
      methods:
        - "public init(_ values: [String: String] = [:])"
        - "public subscript(_ name: String) -> String? { get set }"
        - "public var all: [(name: String, value: String)] { get }"
        - "public func require<Value: ParameterDecodable>(_ name: String, as type: Value.Type = Value.self) throws -> Value"
        - "public func get<Value: ParameterDecodable>(_ name: String, as type: Value.Type = Value.self) throws -> Value?"
      contract: "Header names are case-insensitive; typed lookup throws HeaderError for missing required or invalid values."
    ParameterDecodable:
      kind: protocol
      conforms:
        - Sendable
      methods:
        - "static var parameterTypeDescription: String { get }"
        - "static func decodeParameter(_ value: String) -> Self?"
      built_in_conformers:
        - String
        - Int
        - Double
        - Bool
    ParameterError:
      kind: enum
      conforms:
        - ResponseError
      cases:
        - "missing(name: String)"
        - "invalid(name: String, expected: String)"
      mappings:
        missing: "400 Missing path parameter: <name>"
        invalid: "400 Invalid path parameter <name>: expected <type>"
    QueryParameterError:
      kind: enum
      conforms:
        - ResponseError
      cases:
        - "missing(name: String)"
        - "invalid(name: String, expected: String)"
      mappings:
        missing: "400 Missing query parameter: <name>"
        invalid: "400 Invalid query parameter <name>: expected <type>"
    HeaderError:
      kind: enum
      conforms:
        - ResponseError
      cases:
        - "missing(name: String)"
        - "invalid(name: String, expected: String)"
      mappings:
        missing: "400 Missing header: <name>"
        invalid: "400 Invalid header <name>: expected <type>"
    Path:
      kind: propertyWrapper
      conforms:
        - Sendable
      generic: "Value: ParameterDecodable"
      properties:
        - "wrappedValue: Value"
      initializers:
        - "public init(wrappedValue: Value)"
        - "public init(wrappedValue: Value, _ name: String)"
      contract: "Marker for @DaylilyServer macro path input lowering; extraction is performed by Parameters.require(_:as:)."
    Query:
      kind: propertyWrapper
      conforms:
        - Sendable
      generic: "Value: ParameterDecodable"
      properties:
        - "wrappedValue: Value"
      initializers:
        - "public init(wrappedValue: Value)"
        - "public init(wrappedValue: Value, _ name: String)"
      contract: "Marker for @DaylilyServer macro query input lowering; extraction is performed by QueryParameters.require(_:as:)."
    Header:
      kind: propertyWrapper
      conforms:
        - Sendable
      generic: "Value: ParameterDecodable"
      properties:
        - "wrappedValue: Value"
      initializers:
        - "public init(wrappedValue: Value)"
        - "public init(wrappedValue: Value, _ name: String)"
      contract: "Marker for @DaylilyServer macro header input lowering; extraction is performed by Headers.require(_:as:)."
    Body:
      kind: struct
      conforms:
        - Sendable
      methods:
        - "public static func bytes(_ bytes: [UInt8]) -> Body"
        - "public func collect(upTo limit: ByteCount) async throws -> [UInt8]"
        - "public func string(upTo limit: ByteCount) async throws -> String"
      properties:
        - "bytes: BodyBytes"
      contract: "One-shot body abstraction backed by shared storage."
      transport_spi:
        - "@_spi(Transport) public static func stream(bufferLimit: ByteCount = .megabytes(1)) -> BodyStream"
        - "@_spi(Transport) BodyStream"
        - "@_spi(Transport) BodyStreamWriter"
    BodyBytes:
      kind: struct
      conforms:
        - AsyncSequence
        - Sendable
      element: ByteChunk
    ByteChunk:
      kind: struct
      conforms:
        - Sendable
      properties:
        - "bytes: [UInt8]"
        - "count: Int"
      limitation: "Does not conform to Collection in first version."
    ByteCount:
      kind: struct
      conforms:
        - Comparable
        - Sendable
      properties:
        - "bytes: Int"
      factories:
        - "bytes(_ value: Int)"
        - "kilobytes(_ value: Int)"
        - "megabytes(_ value: Int)"
        - "gigabytes(_ value: Int)"
      unit_base: 1024
    ResponseError:
      kind: protocol
      methods:
        - "var status: Status { get }"
        - "var reason: String { get }"
      conformers:
        - Abort
        - BodyError
        - ParameterError
    BodyError:
      kind: enum
      conforms:
        - ResponseError
      cases:
        - alreadyConsumed
        - "tooLarge(limit: ByteCount)"
        - streamFailed
        - invalidEncoding
      mappings:
        alreadyConsumed: "500 Request body already consumed"
        tooLarge: "413 Request body too large"
        streamFailed: "400 Request body stream failed"
        invalidEncoding: "400 Invalid UTF-8 body"
    Response:
      kind: struct
      conforms:
        - Sendable
      properties:
        - "status: Status"
        - "headers: Headers"
        - "body: [UInt8]"
    ResponseConvertible:
      kind: protocol
      methods:
        - "func toResponse() async throws -> Response"
      conformers:
        - Response
        - Status
        - String
        - "JSON<Value>"
    Handler:
      kind: struct
      role: "uniform async throwing request-to-response wrapper"
    Router:
      kind: struct
      role: "method and path matcher"
    route_dsl:
      functions:
        Get:
          overloads:
            - "(_ path: String, _ handler: @escaping @Sendable () async throws -> R) -> Route"
            - "(_ path: String, _ handler: @escaping @Sendable (Request) async throws -> R) -> Route"
        Post:
          overloads:
            - "(_ path: String, _ handler: @escaping @Sendable () async throws -> R) -> Route"
            - "(_ path: String, _ handler: @escaping @Sendable (Request) async throws -> R) -> Route"
        Put:
          overloads:
            - "(_ path: String, _ handler: @escaping @Sendable () async throws -> R) -> Route"
            - "(_ path: String, _ handler: @escaping @Sendable (Request) async throws -> R) -> Route"
        Patch:
          overloads:
            - "(_ path: String, _ handler: @escaping @Sendable () async throws -> R) -> Route"
            - "(_ path: String, _ handler: @escaping @Sendable (Request) async throws -> R) -> Route"
        Delete:
          overloads:
            - "(_ path: String, _ handler: @escaping @Sendable () async throws -> R) -> Route"
            - "(_ path: String, _ handler: @escaping @Sendable (Request) async throws -> R) -> Route"
        Head:
          overloads:
            - "(_ path: String, _ handler: @escaping @Sendable () async throws -> R) -> Route"
            - "(_ path: String, _ handler: @escaping @Sendable (Request) async throws -> R) -> Route"
        Options:
          overloads:
            - "(_ path: String, _ handler: @escaping @Sendable () async throws -> R) -> Route"
            - "(_ path: String, _ handler: @escaping @Sendable (Request) async throws -> R) -> Route"
        Group:
          signature: "(_ prefix: String, @RouteBuilder routes: () -> [Route]) -> Routes"
  DaylilyJSON:
    JSON:
      kind: struct
      generic: "Value: Encodable & Sendable"
      conforms:
        - ResponseConvertible
      initializer: "public init(_ value: Value, status: Status = .ok, headers: Headers = [:])"
      behavior:
        - "encodes with Foundation JSONEncoder"
        - "sets content-type to application/json unless already present"
    Body_json:
      kind: extension_method
      signature: "public func json<Value: Decodable>(_ type: Value.Type, upTo limit: ByteCount) async throws -> Value"
      behavior:
        - "collects Body with explicit limit"
        - "decodes collected bytes with Foundation JSONDecoder"
        - "throws Abort(.badRequest, reason: \"Invalid JSON body\") on decode failure"
    Request_json:
      kind: extension_method
      signature: "public func json<Value: Decodable>(_ type: Value.Type, upTo limit: ByteCount = .megabytes(1)) async throws -> Value"
      behavior:
        - "delegates to Body.json(_:upTo:)"
        - "default JSON body limit is 1 MB"
      limitations:
        - "does not enforce request content type yet"
    JSONBody:
      kind: propertyWrapper
      conforms:
        - Sendable
      generic: "Value: Decodable & Sendable"
      properties:
        - "wrappedValue: Value"
      initializers:
        - "public init(wrappedValue: Value)"
      contract: "Marker for @DaylilyServer macro JSON body input lowering; decoding is performed by Request.json(_:upTo:)."
  DaylilyNIO:
    NIOHTTPServer:
      kind: struct
      role: transport
      methods:
        - "public func run(started: @escaping @Sendable () async throws -> Void = {}) async throws"
    NIOServerConfiguration:
      kind: struct
      defaults:
        host: "127.0.0.1"
        port: 8080
        backlog: 256
        reuseAddress: true
        maxMessagesPerRead: 16
        gracefulShutdownSignals: true
  DaylilyMacros:
    DaylilyServerMacro:
      kind: macro_implementation
      generated_member: "static func main() async throws"
    RouteMarkerMacro:
      kind: macro_implementation
      generated_peers: []
      used_by:
        - "@GET"
        - "@POST"
        - "@PUT"
        - "@PATCH"
        - "@DELETE"
        - "@HEAD"
        - "@OPTIONS"
        - "@GROUP"

runtime_rules:
  route_priority:
    - literal
    - parameter
    - wildcard
  path_parameter_prefix: ":"
  typed_path_parameter_policy: "Parameters.require(_:as:) and Parameters.get(_:as:) use ParameterDecodable; missing required and invalid values map to 400; UUID is deferred."
  macro_path_parameter_policy: "@Path parameters are marker wrappers; @DaylilyServer validates route membership and lowers them into Parameters.require(_:as:) plus RouteInputMetadata.path(...)."
  query_and_header_input_policy: "Request.query uses QueryParameters; Headers has typed require/get; @Query lowers to req.query.require plus RouteInputMetadata.query(...) and @Header lowers to req.headers.require plus RouteInputMetadata.header(...)."
  macro_json_body_policy: "@JSONBody parameters are marker wrappers in DaylilyJSON; @DaylilyServer lowers them into try await req.json(Type.self) plus RouteBodyMetadata.json(...). True @Body spelling is deferred because Body is the raw request body type."
  lifecycle_policy: "Application lifecycle phases are configure, boot, started, shutdown, cleanup. Application.run binds lifecycle to transport; Application.respond(to:) does not run lifecycle. The default NIO server closes on SIGINT/SIGTERM."
  server_configuration_policy: "ServerConfiguration is the NIO-free user-facing server control type. Application.run(configuration:) bridges it into DaylilyNIO."
  test_client_policy: "TestClient is an in-memory helper in DaylilyTesting; it calls Application.respond(to:) directly and does not use transport. TestRequest and response assertions are testing helpers, not runtime behavior."
  route_metadata_policy: "Route metadata lives in DaylilyCore and is exposed through Route.describe(...) and Application.describeRoutes(); it does not affect routing and is the source of truth for OpenAPI generation."
  openapi_policy: "DaylilyOpenAPI maps Application.describeRoutes() into minimal OpenAPI documents; deep Swift schema derivation and richer operation metadata are separate tasks."
  wildcard_prefix: "*"
  current_body_model: "Body one-shot API with NIO true streaming bridge and in-process buffered Body.bytes support"
  future_body_model: "response body streaming and higher-level upload helpers"
  middleware_order: "application -> router dispatch -> group -> route -> handler"
  middleware_body_policy: "middleware can read Body, but Body remains one-shot and no automatic replay occurs"
  explicit_buffered_body_policy: "withBufferedBody consumes the original Body, buffers under an explicit limit, creates a one-shot replacement Body.bytes value, and does not enable automatic replay"
  observability_policy: "DaylilyObservability owns request ID generation, request logging, timing, public error reason logging, and future observability helpers; DaylilyCore does not depend on logging backends, tracing SDKs, metrics clients, or transport APIs."
  errors:
    response_error: "status + reason"
    abort: "ResponseError conformer"
    body_error: "ResponseError conformer"
    parameter_error: "ResponseError conformer"
    unknown: "500 Internal Server Error"
    missing_route: "404 Not Found"

invariants:
  - "DaylilyCore does not import NIO."
  - "User-facing APIs do not expose NIO types."
  - "Request.body is DaylilyCore.Body."
  - "Body consumption is one-shot."
  - "Runtime APIs are the ground truth."
  - "Macros lower into runtime APIs."
  - "swift build passes."
  - "swift test passes."
  - "swift run starts the server."
  - "swift run HelloDaylily --check passes."
  - "Public API changes update AIDEV."
  - "Tasks are the smallest commit/push unit."
  - "Steps are reviewable but are not committed or pushed independently."

