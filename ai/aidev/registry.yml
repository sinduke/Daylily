implemented_features:
  runtime_dsl:
    status: implemented
    entry_points:
      - Application
      - Get
      - Post
      - Put
      - Patch
      - Delete
      - Head
      - Options
      - Group
  path_parameters:
    status: implemented
    syntax: ":name"
    type: String
  typed_path_extraction_runtime:
    status: implemented
    epic: "0010-typed-handler-inputs"
    task: "0010-001-typed-path-extraction-runtime"
    module: DaylilyCore
    public_api:
      - ParameterDecodable
      - ParameterError
      - "Parameters.require(_:as:)"
      - "Parameters.get(_:as:)"
    supported_types:
      - String
      - Int
      - Double
      - Bool
    decisions:
      - "untyped lookup remains optional String"
      - "missing required path parameter maps to 400 Bad Request"
      - "invalid typed path parameter maps to 400 Bad Request"
      - "UUID is deferred to avoid a Foundation dependency in DaylilyCore"
  path_macro_mvp:
    status: implemented
    epic: "0010-typed-handler-inputs"
    task: "0010-002-path-macro-mvp"
    module: DaylilyMacros
    public_api:
      - "@Path"
    lowering:
      - "bare @Path uses the Swift local parameter name"
      - "@Path(\"name\") maps to an explicit route parameter name"
      - "@DaylilyServer lowers @Path parameters into Parameters.require(_:as:)"
      - "@DaylilyServer lowers @Path parameters into RouteInputMetadata.path(...)"
    supported_with:
      - "@GET"
      - "@POST"
      - "@GROUP"
      - "optional Request parameter"
    decisions:
      - "@Path is a public property-wrapper marker in DaylilyCore"
      - "@Path names must match :name route segments in the full route path"
      - "missing and invalid values keep ParameterError 400 mappings"
      - "JSON body macro input is delivered separately as @JSONBody in 0010-003 and preferred as @Body in 0017-001"
      - "@Query and @Header are delivered in the separate query/header input feature; optional path values are rejected at compile time, and UUID remains deferred"
  json_body_macro_bridge:
    status: implemented
    epic: "0010-typed-handler-inputs"
    task: "0010-003-body-json-macro-runtime-bridge"
    modules:
      - DaylilyJSON
      - DaylilyMacros
    public_api:
      - "@Body"
      - "@JSONBody"
    lowering:
      - "@DaylilyServer lowers @Body parameters into try await req.json(Type.self)"
      - "@DaylilyServer lowers @Body parameters into RouteBodyMetadata.json(...)"
      - "@JSONBody is a compatibility alias spelling with the same lowering"
      - "one @Body or @JSONBody parameter is allowed per handler"
      - "Request plus @Body or @JSONBody is allowed"
    decisions:
      - "@Body is the preferred public property-wrapper marker in DaylilyJSON"
      - "@JSONBody remains available as a compatibility alias spelling"
      - "runtime decoding remains Request.json(_:upTo:) in DaylilyJSON"
      - "default @Body and @JSONBody limit is the existing request.json(...) default of 1 MB"
      - "invalid JSON keeps Abort(.badRequest, reason: \"Invalid JSON body\")"
      - "the raw one-shot request body type is RequestBody"
      - "attached peer macros cannot be applied to function parameters"
  query_and_header_inputs:
    status: implemented
    epic: "0010-typed-handler-inputs"
    task: "0010-004-query-and-header-inputs"
    modules:
      - DaylilyCore
      - DaylilyMacros
      - DaylilyNIO
    public_api:
      - QueryParameters
      - QueryParameterError
      - HeaderError
      - "@Query"
      - "@Header"
      - "Request.query"
      - "Headers.require(_:as:)"
      - "Headers.get(_:as:)"
    lowering:
      - "@DaylilyServer lowers required @Query parameters into req.query.require(_:as:), and optional inputs into req.query.get(_:as:)"
      - "@DaylilyServer lowers required @Header parameters into req.headers.require(_:as:), and optional inputs into req.headers.get(_:as:)"
      - "@DaylilyServer lowers @Query parameters into RouteInputMetadata.query(...)"
      - "@DaylilyServer lowers @Header parameters into RouteInputMetadata.header(...)"
    decisions:
      - "@Query and @Header are public property-wrapper markers in DaylilyCore"
      - "runtime extraction remains the source of truth"
      - "query parsing happens in Request initialization"
      - "Request.path stores the route path without query text"
      - "NIO passes the full request target to Request so query text is available"
      - "query parsing supports &, name=value, empty values, plus-as-space, percent-decoded UTF-8, repeated names, and flag parameters"
      - "Missing required and invalid present query/header values map to source-specific 400 responses; missing optional values become nil"
      - "Optional query/header inputs support T?, Optional<T>, and Swift.Optional<T> with wrapped-type metadata and required: false; optional path inputs are rejected at compile time"
      - "optional query/header macros are implemented; cookies remain deferred"
  application_lifecycle_mvp:
    status: implemented
    epic: "0012-lifecycle-server-controls"
    task: "0012-001-application-lifecycle-mvp"
    modules:
      - DaylilyCore
      - Daylily
      - DaylilyNIO
    public_api:
      - LifecycleOperation
      - LifecyclePhase
      - "Application.lifecycle(_:_:)"
      - "Application.configure(_:)"
      - "Application.boot(_:)"
      - "Application.started(_:)"
      - "Application.shutdown(_:)"
      - "Application.cleanup(_:)"
      - "Application.runLifecycle(_:)"
      - "NIOHTTPServer.run(started:)"
    lifecycle_order:
      - configure
      - boot
      - "NIO bind"
      - started
      - "server close"
      - shutdown
      - cleanup
    decisions:
      - "Lifecycle hooks run in registration order within each phase"
      - "Application.respond(to:) does not run lifecycle hooks"
      - "Application.run calls started only after NIO bind succeeds"
      - "shutdown and cleanup are attempted if server run fails after boot"
      - "lifecycle APIs do not expose NIO types"
  graceful_shutdown:
    status: implemented
    epic: "0012-lifecycle-server-controls"
    task: "0012-002-graceful-shutdown"
    module: DaylilyNIO
    behavior:
      - "SIGINT and SIGTERM stop accepting work and drain active connections within shutdownGracePeriod"
      - "Application.run can continue into shutdown and cleanup lifecycle phases"
    decisions:
      - "signal handling is transport-owned"
      - "NIO channel types are not exposed to user APIs"
      - "0024 adds connection quiescing, bounded graceful drain, and immediate force cancellation"
  server_configuration:
    status: implemented
    epic: "0012-lifecycle-server-controls"
    task: "0012-003-server-configuration"
    modules:
      - DaylilyCore
      - Daylily
      - DaylilyNIO
    public_api:
      - ServerConfiguration
      - "Application.run(configuration:responseObserver:)"
      - "NIOServerConfiguration.init(_:)"
    defaults:
      host: "127.0.0.1"
      port: 8080
      backlog: 256
      reuseAddress: true
      maxMessagesPerRead: 16
      gracefulShutdownSignals: true
      requestHeaderTimeout: ".seconds(15)"
      uploadIdleTimeout: ".seconds(30)"
      shutdownGracePeriod: ".seconds(10)"
      responseWriteTimeout: ".seconds(30)"
      responseObserverCapacity: 64
    decisions:
      - "ServerConfiguration is NIO-free and lives in DaylilyCore"
      - "Application.run(host:port:) remains convenience sugar"
      - "Application.run(configuration:) is the explicit server control API"
      - "NIOServerConfiguration mirrors the active NIO transport controls"
      - "Header/upload durations must be positive; shutdown grace must be nonnegative. Nil disables the corresponding deadline."
      - "Upload idle time excludes server body backpressure and ends when an early response abandons the body."
      - "Observer injection is separate from equatable ServerConfiguration and defaults to nil."
  daylily_testing_minimal_client:
    status: implemented
    epic: "0011-daylily-testing"
    task: "0011-001-minimal-test-client"
    module: DaylilyTesting
    public_api:
      - TestClient
      - "TestClient.respond(to:)"
      - "TestClient.get(_:headers:)"
      - "TestClient.post(_:headers:body:)"
    decisions:
      - "TestClient calls Application.respond(to:) directly"
      - "0011-001 kept DaylilyTesting to DaylilyCore only"
      - "TestClient is transport-free and opens no sockets"
      - "rich request builders and JSON assertions are delivered by 0011-002"
  daylily_testing_request_builders_and_json_assertions:
    status: implemented
    epic: "0011-daylily-testing"
    task: "0011-002-request-builders-and-json-assertions"
    module: DaylilyTesting
    public_api:
      - TestRequest
      - TestFailure
      - "TestClient.send(_:)"
      - "TestClient.postJSON(_:headers:body:)"
      - "Response.json(_:)"
      - "Response.requireStatus(_:)"
      - "Response.requireBody(_:)"
      - "Response.requireJSON(_:as:)"
    decisions:
      - "TestRequest builds in-memory Request values"
      - "TestRequest.withJSON encodes with Foundation JSONEncoder"
      - "TestRequest.withJSON sets content-type to application/json when absent"
      - "Response JSON helpers decode with Foundation JSONDecoder"
      - "Response assertion helpers throw TestFailure"
      - "DaylilyTesting remains transport-free and NIO-free"
      - "runtime JSON behavior remains owned by DaylilyJSON"
  runtime_and_testing_http_verbs:
    status: implemented
    epic: "0015-http-verbs-beta-closure"
    task: "0015-001-runtime-and-testing-http-verbs"
    modules:
      - DaylilyCore
      - DaylilyTesting
      - HelloDaylily
    public_api:
      - "HTTPMethod.head"
      - "HTTPMethod.options"
      - Put
      - Patch
      - Delete
      - Head
      - Options
      - "TestClient.put(_:headers:body:)"
      - "TestClient.patch(_:headers:body:)"
      - "TestClient.delete(_:headers:)"
      - "TestClient.head(_:headers:)"
      - "TestClient.options(_:headers:)"
      - "TestRequest.put(_:headers:body:)"
      - "TestRequest.patch(_:headers:body:)"
      - "TestRequest.delete(_:headers:)"
      - "TestRequest.head(_:headers:)"
      - "TestRequest.options(_:headers:)"
    decisions:
      - "PUT, PATCH, DELETE, HEAD, and OPTIONS are first-class runtime route DSL functions."
      - "HEAD and OPTIONS are explicit route methods only in this slice."
      - "No automatic HEAD to GET fallback is introduced."
      - "No automatic OPTIONS Allow response is introduced."
      - "DELETE has no special default response; examples may return Status.noContent."
      - "Macro support is deferred to 0015-002."
  nio_http_server:
    status: implemented
    protocol: HTTP/1.1
  buffered_body:
    status: implemented
    type: "RequestBody.bytes(...) for in-process and manually constructed requests"
  aidev_contract:
