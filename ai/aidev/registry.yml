project:
  name: Daylily
  package: Daylily
  summary: "AI-native web framework for Swift"
  license: MIT
  license_file: LICENSE
  swift_tools_version: "6.3"
  current_phase: "alpha3_release"
  authoritative_ai_entry:
    - AIDEV.md
    - ai/aidev/start-here.md
  default_run: "swift run"
  check_command: "swift run HelloDaylily --check"
  test_command: "swift test"
  xcode_toolchain_test_command: "DEVELOPER_DIR=/Applications/Xcode-26.5.0.app/Contents/Developer swift test"
  build_command: "swift build"
  ci_workflow: ".github/workflows/ci.yml"
  ci_checkout_action: "actions/checkout@v6"

work_model:
  hierarchy:
    - epic
    - task
    - step
  epic_directory: "ai/epics"
  task_directory: "ai/tasks"
  epic_file_format: "NNNN-short-kebab-name.md"
  task_file_format: "NNNN-XXX-short-kebab-name.md"
  step_format: "NNNN-XXX.n"
  commit_unit: task
  rules:
    - "Epics are planning containers, not direct implementation units."
    - "Tasks are the smallest commit/push unit."
    - "Steps live inside task files as checklists."
    - "Step completion may be reviewed and fixed but must not be committed or pushed independently."
    - "Do not create A/B/C task files for sub-steps."

dependencies:
  swift-nio:
    url: "https://github.com/apple/swift-nio.git"
    requirement: "from 2.74.0"
    resolved: "2.100.0"
  swift-http-types:
    url: "https://github.com/apple/swift-http-types.git"
    requirement: "from 1.5.1"
    resolved: "1.5.1"
  swift-log:
    url: "https://github.com/apple/swift-log.git"
    requirement: "from 1.13.0"
    resolved: "1.13.1"
  swift-service-lifecycle:
    url: "https://github.com/swift-server/swift-service-lifecycle.git"
    requirement: "from 2.11.0"
    resolved: "2.11.0"
  swift-syntax:
    url: "https://github.com/swiftlang/swift-syntax.git"
    requirement: "from 603.0.1"
    resolved: "603.0.1"

source_reading_policy:
  aidev_is_authoritative: true
  source_reading_allowed_for:
    - exact_edits
    - compiler_errors
    - implementation_mismatch_checks
  source_reading_not_required_for:
    - project_understanding
    - architecture_planning
    - public_api_policy
    - extension_strategy

products:
  Daylily:
    kind: library
    role: user_facing_reexport
    responsibility:
      - reexport_core
      - reexport_json
      - reexport_nio_transport
      - reexport_observability
      - reexport_openapi
      - provide_application_run
      - expose_route_macros
    depends_on:
      - DaylilyCore
      - DaylilyJSON
      - DaylilyMacros
      - DaylilyNIO
      - DaylilyObservability
      - DaylilyOpenAPI
  DaylilyJSON:
    kind: library
    role: json_helpers
    responsibility:
      - decode_json_request_bodies
      - encode_json_responses
      - provide_json_body_marker
      - keep_foundation_json_out_of_core
    depends_on:
      - DaylilyCore
      - Foundation
  DaylilyMacros:
    kind: macro
    role: macro_implementation
    responsibility:
      - implement_DaylilyServer
      - implement_GET_marker
      - implement_POST_marker
      - implement_GROUP_marker
      - lower_macro_routes_to_runtime_dsl
      - lower_typed_handler_inputs_to_runtime_apis
      - lower_typed_handler_inputs_to_route_metadata
      - lower_macro_middleware_to_runtime_middleware
      - lower_macro_security_to_route_metadata
    depends_on:
      - SwiftCompilerPlugin
      - SwiftSyntax
      - SwiftSyntaxBuilder
      - SwiftSyntaxMacros
  DaylilyCore:
    kind: library
    role: runtime_core
    responsibility:
      - application_runtime
      - route_model
      - route_metadata
      - route_security_metadata
      - router_matching
      - request_response_models
      - body_model
      - middleware_runtime
      - lifecycle_runtime
      - dependencies_registry
      - server_configuration
      - transport_free_response_transfer_event_and_observer
      - response_conversion
      - path_parameters
      - query_parameters
      - typed_headers
      - basic_errors
    depends_on: []
    allowed_imports:
      - Swift Standard Library
    forbidden_imports:
      - NIO
      - NIOCore
      - NIOHTTP1
      - NIOPosix
    public_api_must_not_expose:
      - EventLoopFuture
      - Channel
      - ChannelHandler
      - ChannelHandlerContext
      - ByteBuffer
  DaylilyNIO:
    kind: library
    role: nio_transport
    responsibility:
      - bind_http_server
      - expose_started_callback_after_bind
      - create_daylily_request_after_nio_head
      - stream_nio_body_chunks_into_daylily_body
      - apply_bounded_body_buffering_and_backpressure
      - translate_daylily_response_to_nio_response
      - bridge_async_responder_to_event_loop
      - enforce_header_and_upload_idle_deadlines
      - quiesce_connections_and_bound_graceful_drain
      - arbitrate_terminal_response_transfer_events
    depends_on:
      - DaylilyCore
      - NIOCore
      - NIOConcurrencyHelpers
      - NIOHTTP1
      - NIOPosix
  DaylilyObservability:
    kind: library
    role: observability_helpers
    responsibility:
      - provide_request_id_middleware
      - provide_request_id_generator
      - provide_request_logging_middleware
      - provide_request_log_sink_protocol
      - provide_console_request_log_sink
      - provide_in_memory_request_log_sink_for_checks
      - record_request_duration_and_public_error_reason
      - provide_console_and_in_memory_response_transfer_observers
      - keep_logging_and_tracing_out_of_core
    depends_on:
      - DaylilyCore
      - Foundation
    forbidden_imports:
      - NIO
      - NIOCore
      - NIOHTTP1
      - NIOPosix
      - Logging
  DaylilySwiftLog:
    kind: library
    role: swift_log_adapter
    responsibility:
      - adapt_request_log_to_swift_log
      - provide_swift_log_request_log_sink
      - adapt_response_transfer_events_to_swift_log
      - keep_swift_log_out_of_core_and_observability
      - avoid_global_logging_bootstrap
    depends_on:
      - DaylilyCore
      - DaylilyObservability
      - Logging
    not_reexported_by:
      - Daylily
  DaylilyHTTPTypes:
    kind: library
    role: swift_http_types_adapter
    responsibility:
      - adapt_daylily_request_to_http_types_request
      - adapt_http_types_request_to_daylily_request
      - adapt_daylily_response_to_http_types_response
