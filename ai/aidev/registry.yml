    ServerConfiguration:
      kind: struct
      conforms:
        - Equatable
        - Sendable
      properties:
        - "host: String"
        - "port: Int"
        - "backlog: Int"
        - "reuseAddress: Bool"
        - "maxMessagesPerRead: Int"
        - "gracefulShutdownSignals: Bool"
        - "requestHeaderTimeout: Duration?"
        - "uploadIdleTimeout: Duration?"
        - "shutdownGracePeriod: Duration?"
        - "responseWriteTimeout: Duration?"
        - "responseObserverCapacity: Int"
      initializer: "public init(host: String = \"127.0.0.1\", port: Int = 8080, backlog: Int = 256, reuseAddress: Bool = true, maxMessagesPerRead: Int = 16, gracefulShutdownSignals: Bool = true, requestHeaderTimeout: Duration? = .seconds(15), uploadIdleTimeout: Duration? = .seconds(30), shutdownGracePeriod: Duration? = .seconds(10), responseWriteTimeout: Duration? = .seconds(30), responseObserverCapacity: Int = 64)"
      contract: "NIO-free equatable configuration. Nil disables a deadline; nil grace waits until completion or force cancellation; zero grace closes immediately. Header/upload durations must be positive and grace nonnegative."
    ResponseTransferDeliverySnapshot:
      kind: struct
      conforms: [Equatable, Sendable]
      properties: ["public let capacity: Int", "public let inFlight: Int", "public let completedEvents: UInt64", "public let droppedEvents: UInt64"]
      initializer: "public init(capacity: Int, inFlight: Int, completedEvents: UInt64, droppedEvents: UInt64)"
      contract: "Server-wide bounded callback delivery counters; nil server snapshot when observer is disabled. Excess newest events are dropped without queuing tasks."
    ResponseTransferOutcome:
      kind: enum
      raw_type: String
      conforms: [Equatable, Sendable]
      cases: [completed, cancelled, failed]
      contract: "Terminal transport outcome is independent of the HTTP response status."
    ResponseTransferEvent:
      kind: struct
      conforms: [Equatable, Sendable]
      properties:
        - "public let method: HTTPMethod?"
        - "public let path: String?"
        - "public let status: Status"
        - "public let requestID: String?"
        - "public let correlationID: String?"
        - "public let bytesSent: Int"
        - "public let durationNanoseconds: UInt64"
        - "public let outcome: ResponseTransferOutcome"
      initializer: "public init(method: HTTPMethod? = nil, path: String? = nil, status: Status, requestID: String? = nil, correlationID: String? = nil, bytesSent: Int, durationNanoseconds: UInt64, outcome: ResponseTransferOutcome)"
      contract: "Immutable terminal snapshot. Counts successfully flushed body bytes, not headers/framing or peer consumption. Duration excludes handler production and observer delivery."
    ResponseTransferObserver:
      kind: protocol
      conforms: [Sendable]
      methods:
        - "func record(_ event: ResponseTransferEvent) async"
      contract: "Nonthrowing sink delivered outside the event loop after exactly-once terminal arbitration and bounded synchronous admission. Saturation drops newest events; calls may overlap or arrive out of order. Shutdown does not await sink completion; durable delivery belongs to the application."
    Route:
      kind: struct
      conforms:
        - Sendable
      properties:
        - "method: HTTPMethod"
        - "path: String"
        - "handler: Handler"
