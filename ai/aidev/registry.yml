  DaylilyCore:
    ResponseBody:
      kind: struct
      conforms: [Sendable]
      properties: ["bufferedBytes: [UInt8]?", "isStreaming: Bool", "length: Int?"]
      methods:
        - "public static func bytes(_ bytes: [UInt8]) -> ResponseBody"
        - "public static func stream(length: Int? = nil, _ producer: @escaping Producer) -> ResponseBody"
        - "public func collect(upTo: ByteCount) async throws -> [UInt8]"
      contract: "Buffered bytes or a one-shot demand-driven producer shared by copies."
    ResponseBodyWriter:
      kind: struct
      conforms: [Sendable]
      methods: ["write(ByteChunk) async throws", "write([UInt8]) async throws", "write(String) async throws", "write(ServerSentEvent) async throws"]
      contract: "Await writes; concurrent or post-finish use throws. Transport owns completion."
    ResponseBodyError:
      kind: enum
      conforms: [Error, Equatable, Sendable]
      cases: [alreadyConsumed, "tooLarge(limit: ByteCount)", "lengthMismatch(expected: Int, actual: Int)", concurrentWrite, writerFinished]
    ServerSentEvent:
      kind: struct
      conforms: [Equatable, Sendable]
      properties: ["data: String", "id: String?", "event: String?", "retry: Int?", "encoded: String"]
      methods: ["init(data: String, id: String? = nil, event: String? = nil, retry: Int? = nil)"]
      contract: "UTF-8 SSE fields; retry is milliseconds, data supports multiline values."
    LifecycleFailure:
      kind: struct
      conforms: [Sendable]
      properties: ["phase: LifecyclePhase", "hookIndex: Int", "error: any Error"]
      methods: ["init(phase: LifecyclePhase, hookIndex: Int, error: any Error)"]
    LifecycleRunError:
      kind: struct
      conforms: [Error, Sendable]
      properties: ["primaryError: (any Error)?", "failures: [LifecycleFailure]"]
      methods: ["init(primaryError: (any Error)?, failures: [LifecycleFailure])"]
    Application:
      kind: struct
      conforms:
        - Sendable
      methods:
        - "public init(@RouteBuilder routes: () -> [Route])"
        - "public init(dependencies configureDependencies: @Sendable (inout Dependencies) -> Void = { _ in }, @RouteBuilder routes: () -> [Route])"
        - "public init(routes: [Route])"
        - "public init(routes: [Route], dependencies: Dependencies)"
        - "public init(routes: Routes)"
        - "public func middleware<M: Middleware>(_ middleware: M) -> Application"
        - "public func lifecycle(_ phase: LifecyclePhase, _ operation: @escaping LifecycleOperation) -> Application"
        - "public func configure(_ operation: @escaping LifecycleOperation) -> Application"
        - "public func boot(_ operation: @escaping LifecycleOperation) -> Application"
        - "public func started(_ operation: @escaping LifecycleOperation) -> Application"
        - "public func shutdown(_ operation: @escaping LifecycleOperation) -> Application"
        - "public func cleanup(_ operation: @escaping LifecycleOperation) -> Application"
        - "public func runLifecycle(_ phase: LifecyclePhase) async throws"
        - "public func describeRoutes() -> [RouteDescription]"
        - "public func respond(to request: Request) async -> Response"
      contract: "Always returns a Response; stamps application dependencies onto the request; runs application middleware around router dispatch; converts ResponseError and unknown errors; lifecycle hooks are explicit and not run by respond(to:); describeRoutes exposes route metadata without invoking handlers."
    DependencyKey:
      kind: struct
      conforms:
        - Sendable
      generic_parameters:
        - Value
      properties:
        - "name: String"
      methods:
        - "public init(_ name: String)"
      contract: "Typed app-owned dependency key; keyed lookup identity combines Value type and name."
    Dependency:
      kind: propertyWrapper
      conforms:
        - Sendable
      generic: "Value: Sendable"
      properties:
        - "wrappedValue: Value"
      initializers:
        - "public init(wrappedValue: Value, _ key: DependencyKey<Value>)"
      contract: "Marker for @DaylilyServer macro keyed dependency input lowering; extraction is performed by Request.dependencies.require(key)."
    Dependencies:
      kind: struct
      conforms:
        - Sendable
      methods:
        - "public init()"
        - "public mutating func register<Value: Sendable>(_ value: Value)"
        - "public mutating func register<Value: Sendable>(_ value: Value, for key: DependencyKey<Value>)"
        - "public func get<Value: Sendable>(_ type: Value.Type = Value.self) -> Value?"
        - "public func get<Value: Sendable>(_ key: DependencyKey<Value>) -> Value?"
        - "public func require<Value: Sendable>(_ type: Value.Type = Value.self) throws -> Value"
        - "public func require<Value: Sendable>(_ key: DependencyKey<Value>) throws -> Value"
      contract: "App-wide default dependency registry storing concrete Sendable values by concrete metatype and keyed Sendable values by DependencyKey<Value>; optional helper, not mandatory application architecture."
    DependencyError:
      kind: struct
      conforms:
        - ResponseError
      properties:
        - "typeName: String"
        - "keyName: String?"
        - "status: Status"
        - "reason: String"
      methods:
        - "public static func missing<Value>(_ type: Value.Type) -> DependencyError"
        - "public static func missing<Value>(_ key: DependencyKey<Value>) -> DependencyError"
      contract: "Missing required dependency response error; keyed misses include value type and key name; maps to 500 Internal Server Error."
    LifecyclePhase:
      kind: enum
      conforms:
        - Sendable
        - CaseIterable
      cases:
        - configure
        - boot
        - started
        - shutdown
        - cleanup
    LifecycleOperation:
      kind: typealias
      signature: "public typealias LifecycleOperation = @Sendable () async throws -> Void"
    HTTPMethod:
      kind: struct
