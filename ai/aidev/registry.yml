      kind: struct
      conforms:
        - Equatable
        - Sendable
      properties:
        - "method: HTTPMethod"
        - "path: String"
        - "metadata: RouteMetadata"
    Routes:
      kind: struct
      conforms:
        - Sendable
      methods:
        - "public func middleware<M: Middleware>(_ middleware: M) -> Routes"
      contract: "Group route collection wrapper accepted by RouteBuilder; resolves group middleware before route middleware."
    Middleware:
      kind: protocol
      conforms:
        - Sendable
      methods:
        - "func handle(_ request: Request, next: Handler) async throws -> Response"
      contract: "Middleware can inspect Request, call next, transform Response, short-circuit, or throw."
    Request:
      kind: struct
      conforms:
        - Sendable
      properties:
        - "method: HTTPMethod"
        - "rawTarget: String?"
        - "path: String"
        - "scheme: String?"
        - "authority: String?"
        - "extendedConnectProtocol: String?"
        - "headers: Headers"
        - "body: RequestBody"
        - "parameters: Parameters"
        - "query: QueryParameters"
        - "dependencies: Dependencies"
        - "target: String"
      methods:
        - "public init(method:path:scheme:authority:extendedConnectProtocol:headers:body: RequestBody = .bytes([]), parameters: Parameters = Parameters(), query: QueryParameters? = nil, dependencies: Dependencies = Dependencies())"
        - "public init(method:rawTarget:scheme:authority:extendedConnectProtocol:headers:body: RequestBody = .bytes([]), parameters: Parameters = Parameters(), query: QueryParameters? = nil, dependencies: Dependencies = Dependencies())"
        - "public init(method:path:scheme:authority:extendedConnectProtocol:headers:body: [UInt8], parameters: Parameters = Parameters(), query: QueryParameters? = nil, dependencies: Dependencies = Dependencies())"
        - "public func with(parameters: Parameters) -> Request"
        - "public func with(body: RequestBody) -> Request"
        - "public func with(headers: Headers) -> Request"
        - "public func with(dependencies: Dependencies) -> Request"
        - "public func with(query: QueryParameters) -> Request"
        - "public func withBufferedBody<R: Sendable>(upTo limit: ByteCount, _ operation: @Sendable (Request, [UInt8]) async throws -> R) async throws -> R"
      contract: "Request preserves rawTarget separately from parsed path and query; Application.respond(to:) stamps application dependencies onto requests; DaylilyNIO creates streaming RequestBody values through transport SPI; in-process callers may use RequestBody.bytes(...); request copying helpers preserve one-shot body storage, raw target, query, and pseudo fields; explicit body buffering uses withBufferedBody(upTo:_:)."
    Parameters:
      kind: struct
      conforms:
        - Equatable
        - Sendable
      methods:
        - "public init(_ storage: [String: String] = [:])"
        - "public subscript(_ name: String) -> String? { get }"
        - "public subscript(dynamicMember name: String) -> String? { get }"
        - "public func require<Value: ParameterDecodable>(_ name: String, as type: Value.Type = Value.self) throws -> Value"
        - "public func get<Value: ParameterDecodable>(_ name: String, as type: Value.Type = Value.self) throws -> Value?"
      contract: "Untyped path lookup returns optional String; typed lookup throws ParameterError for missing required or invalid values."
    QueryParameters:
      kind: struct
      conforms:
        - Equatable
        - Sendable
      properties:
        - "rawValue: String?"
        - "all: [(name: String, value: String)]"
        - "parameters: [QueryParameter]"
        - "queryString: String?"
      methods:
        - "public init(_ storage: [String: String] = [:])"
        - "public init(_ parameters: [QueryParameter], rawValue: String? = nil)"
        - "public init(rawValue: String)"
        - "public subscript(_ name: String) -> String? { get }"
        - "public subscript(dynamicMember name: String) -> String? { get }"
        - "public func values(for name: String) -> [String]"
        - "public func require<Value: ParameterDecodable>(_ name: String, as type: Value.Type = Value.self) throws -> Value"
        - "public func get<Value: ParameterDecodable>(_ name: String, as type: Value.Type = Value.self) throws -> Value?"
      contract: "Preserves ordered query parameters, repeated names, raw query text, and flag parameters; untyped lookup returns the last matching optional String; typed lookup throws QueryParameterError for missing required or invalid values."
    QueryParameter:
      kind: struct
      conforms:
        - Equatable
        - Sendable
      properties:
        - "name: String"
        - "value: String"
        - "hasValue: Bool"
        - "rawName: String?"
        - "rawValue: String?"
    Headers:
      kind: struct
      conforms:
        - Equatable
        - Sendable
        - ExpressibleByDictionaryLiteral
      properties:
        - "all: [(name: String, value: String)]"
        - "fields: [HeaderField]"
      methods:
        - "public init(_ values: [String: String] = [:])"
        - "public init(_ fields: [HeaderField])"
        - "public init(fields: [(name: String, value: String)])"
        - "public subscript(_ name: String) -> String? { get set }"
        - "public subscript(values name: String) -> [String] { get set }"
        - "public mutating func add(name: String, value: String, indexingStrategy: HeaderField.DynamicTableIndexingStrategy = .automatic)"
        - "public mutating func remove(_ name: String)"
        - "public func values(for name: String) -> [String]"
        - "public func require<Value: ParameterDecodable>(_ name: String, as type: Value.Type = Value.self) throws -> Value"
        - "public func get<Value: ParameterDecodable>(_ name: String, as type: Value.Type = Value.self) throws -> Value?"
      contract: "Preserves ordered and repeated header fields with case-insensitive lookup; subscript assignment replaces all values for a name; typed lookup throws HeaderError for missing required or invalid values."
    HeaderField:
      kind: struct
      conforms:
        - Equatable
        - Sendable
      properties:
        - "name: String"
        - "value: String"
        - "indexingStrategy: HeaderField.DynamicTableIndexingStrategy"
    ParameterDecodable:
      kind: protocol
      conforms:
        - Sendable
      methods:
        - "static var parameterTypeDescription: String { get }"
        - "static func decodeParameter(_ value: String) -> Self?"
      built_in_conformers:
        - String
        - Int
        - Double
        - Bool
    ParameterError:
      kind: enum
      conforms:
        - ResponseError
      cases:
        - "missing(name: String)"
        - "invalid(name: String, expected: String)"
      mappings:
        missing: "400 Missing path parameter: <name>"
        invalid: "400 Invalid path parameter <name>: expected <type>"
    QueryParameterError:
      kind: enum
      conforms:
        - ResponseError
      cases:
        - "missing(name: String)"
        - "invalid(name: String, expected: String)"
      mappings:
        missing: "400 Missing query parameter: <name>"
        invalid: "400 Invalid query parameter <name>: expected <type>"
    HeaderError:
      kind: enum
      conforms:
        - ResponseError
      cases:
        - "missing(name: String)"
        - "invalid(name: String, expected: String)"
      mappings:
        missing: "400 Missing header: <name>"
        invalid: "400 Invalid header <name>: expected <type>"
    Path:
      kind: propertyWrapper
      conforms:
        - Sendable
      generic: "Value: ParameterDecodable"
      properties:
        - "wrappedValue: Value"
      initializers:
        - "public init(wrappedValue: Value)"
        - "public init(wrappedValue: Value, _ name: String)"
      contract: "Marker for @DaylilyServer macro path input lowering; extraction is performed by Parameters.require(_:as:)."
    Query:
      kind: propertyWrapper
      conforms:
        - Sendable
      generic: "Value: Sendable"
      properties:
        - "wrappedValue: Value"
      initializers:
        - "public init(wrappedValue: Value)"
        - "public init(wrappedValue: Value, _ name: String)"
      contract: "Marker for @DaylilyServer macro query input lowering; required inputs use QueryParameters.require, optional inputs use get with wrapped scalar metadata."
    Header:
      kind: propertyWrapper
      conforms:
        - Sendable
      generic: "Value: Sendable"
      properties:
        - "wrappedValue: Value"
      initializers:
        - "public init(wrappedValue: Value)"
        - "public init(wrappedValue: Value, _ name: String)"
      contract: "Marker for @DaylilyServer macro header input lowering; required inputs use Headers.require, optional inputs use get with wrapped scalar metadata."
    RequestBody:
      kind: struct
      conforms:
        - Sendable
      methods:
        - "public static func bytes(_ bytes: [UInt8]) -> RequestBody"
        - "public func collect(upTo limit: ByteCount) async throws -> [UInt8]"
        - "public func string(upTo limit: ByteCount) async throws -> String"
      properties:
        - "bytes: BodyBytes"
      contract: "One-shot body abstraction backed by shared storage."
      transport_spi:
        - "@_spi(Transport) public static func stream(bufferLimit: ByteCount = .megabytes(1)) -> BodyStream"
        - "@_spi(Transport) BodyStream"
        - "@_spi(Transport) BodyStreamWriter"
    BodyBytes:
      kind: struct
      conforms:
        - AsyncSequence
        - Sendable
      element: ByteChunk
    ByteChunk:
      kind: struct
      conforms:
        - Sendable
      properties:
        - "bytes: [UInt8]"
        - "count: Int"
      limitation: "Does not conform to Collection in first version."
    ByteCount:
      kind: struct
      conforms:
        - Comparable
        - Sendable
      properties:
        - "bytes: Int"
      factories:
        - "bytes(_ value: Int)"
        - "kilobytes(_ value: Int)"
        - "megabytes(_ value: Int)"
        - "gigabytes(_ value: Int)"
      unit_base: 1024
    ResponseError:
      kind: protocol
      methods:
        - "var status: Status { get }"
        - "var reason: String { get }"
      conformers:
        - Abort
        - BodyError
        - ParameterError
    BodyError:
      kind: enum
      conforms:
        - ResponseError
      cases:
        - alreadyConsumed
        - "tooLarge(limit: ByteCount)"
        - streamFailed
        - invalidEncoding
      mappings:
        alreadyConsumed: "500 Request body already consumed"
        tooLarge: "413 Request body too large"
        streamFailed: "400 Request body stream failed"
        invalidEncoding: "400 Invalid UTF-8 body"
    Response:
      kind: struct
      conforms:
        - Sendable
      properties:
        - "status: Status"
        - "headers: Headers"
        - "body: [UInt8] (buffered compatibility view)"
        - "responseBody: ResponseBody"
    ResponseConvertible:
      kind: protocol
      methods:
        - "func toResponse() async throws -> Response"
      conformers:
        - Response
        - Status
        - String
        - "JSON<Value>"
    Handler:
      kind: struct
      role: "uniform async throwing request-to-response wrapper"
    Router:
      kind: struct
      role: "method and path matcher"
    route_dsl:
      functions:
        Get:
          overloads:
            - "(_ path: String, _ handler: @escaping @Sendable () async throws -> R) -> Route"
            - "(_ path: String, _ handler: @escaping @Sendable (Request) async throws -> R) -> Route"
        Post:
          overloads:
            - "(_ path: String, _ handler: @escaping @Sendable () async throws -> R) -> Route"
            - "(_ path: String, _ handler: @escaping @Sendable (Request) async throws -> R) -> Route"
        Put:
          overloads:
            - "(_ path: String, _ handler: @escaping @Sendable () async throws -> R) -> Route"
            - "(_ path: String, _ handler: @escaping @Sendable (Request) async throws -> R) -> Route"
        Patch:
          overloads:
            - "(_ path: String, _ handler: @escaping @Sendable () async throws -> R) -> Route"
            - "(_ path: String, _ handler: @escaping @Sendable (Request) async throws -> R) -> Route"
        Delete:
          overloads:
            - "(_ path: String, _ handler: @escaping @Sendable () async throws -> R) -> Route"
            - "(_ path: String, _ handler: @escaping @Sendable (Request) async throws -> R) -> Route"
        Head:
          overloads:
            - "(_ path: String, _ handler: @escaping @Sendable () async throws -> R) -> Route"
            - "(_ path: String, _ handler: @escaping @Sendable (Request) async throws -> R) -> Route"
        Options:
          overloads:
            - "(_ path: String, _ handler: @escaping @Sendable () async throws -> R) -> Route"
            - "(_ path: String, _ handler: @escaping @Sendable (Request) async throws -> R) -> Route"
        Group:
          signature: "(_ prefix: String, @RouteBuilder routes: () -> [Route]) -> Routes"
  DaylilyJSON:
    JSON:
      kind: struct
      generic: "Value: Encodable & Sendable"
      conforms:
        - ResponseConvertible
      initializer: "public init(_ value: Value, status: Status = .ok, headers: Headers = [:])"
      behavior:
        - "encodes with Foundation JSONEncoder"
        - "sets content-type to application/json unless already present"
    Body_json:
      kind: extension_method
      signature: "public func json<Value: Decodable>(_ type: Value.Type, upTo limit: ByteCount) async throws -> Value"
      behavior:
        - "collects RequestBody with explicit limit"
        - "decodes collected bytes with Foundation JSONDecoder"
        - "throws Abort(.badRequest, reason: \"Invalid JSON body\") on decode failure"
    Request_json:
      kind: extension_method
      signature: "public func json<Value: Decodable>(_ type: Value.Type, upTo limit: ByteCount = .megabytes(1)) async throws -> Value"
      behavior:
        - "delegates to RequestBody.json(_:upTo:)"
        - "default JSON body limit is 1 MB"
      limitations:
        - "does not enforce request content type yet"
    Body:
      kind: propertyWrapper
      conforms:
        - Sendable
      generic: "Value: Decodable & Sendable"
      properties:
        - "wrappedValue: Value"
      initializers:
        - "public init(wrappedValue: Value)"
      contract: "Preferred marker for @DaylilyServer macro JSON body input lowering; decoding is performed by Request.json(_:upTo:)."
    JSONBody:
      kind: propertyWrapper
      conforms:
        - Sendable
      generic: "Value: Decodable & Sendable"
      properties:
        - "wrappedValue: Value"
      initializers:
        - "public init(wrappedValue: Value)"
      contract: "Compatibility alias spelling for @Body macro JSON body input lowering; decoding is performed by Request.json(_:upTo:)."
  DaylilyNIO:
    NIOHTTPServer:
      kind: struct
      role: transport
      conforms: [Sendable]
      properties: ["public var responseObserverSnapshot: ResponseTransferDeliverySnapshot? { get }"]
      initializer: "public init(configuration: NIOServerConfiguration = NIOServerConfiguration(), responseObserver: (any ResponseTransferObserver)? = nil, responder: @escaping @Sendable (Request) async -> Response)"
      methods:
        - "public func run(started: @escaping @Sendable () async throws -> Void = {}) async throws"
        - "@_spi(ServiceLifecycle) public func run(started: @escaping @Sendable () async throws -> Void = {}, shutdownRequests: AsyncStream<Void>) async throws"
    NIOServerConfiguration:
      kind: struct
      conforms: [Sendable]
      properties:
        - "host: String"
        - "port: Int"
        - "backlog: Int"
        - "reuseAddress: Bool"
        - "maxMessagesPerRead: Int"
        - "gracefulShutdownSignals: Bool"
        - "requestHeaderTimeout: Duration?"
        - "uploadIdleTimeout: Duration?"
        - "shutdownGracePeriod: Duration?"
        - "responseWriteTimeout: Duration?"
        - "responseObserverCapacity: Int"
      initializers:
        - "public init(host: String = \"127.0.0.1\", port: Int = 8080, backlog: Int = 256, reuseAddress: Bool = true, maxMessagesPerRead: Int = 16, gracefulShutdownSignals: Bool = true, requestHeaderTimeout: Duration? = .seconds(15), uploadIdleTimeout: Duration? = .seconds(30), shutdownGracePeriod: Duration? = .seconds(10), responseWriteTimeout: Duration? = .seconds(30), responseObserverCapacity: Int = 64)"
        - "public init(_ configuration: ServerConfiguration)"
      defaults:
        host: "127.0.0.1"
        port: 8080
        backlog: 256
        reuseAddress: true
        maxMessagesPerRead: 16
        gracefulShutdownSignals: true
        requestHeaderTimeout: ".seconds(15)"
        uploadIdleTimeout: ".seconds(30)"
        shutdownGracePeriod: ".seconds(10)"
        responseWriteTimeout: ".seconds(30)"
        responseObserverCapacity: 64
  DaylilyMacros:
    DaylilyServerMacro:
      kind: macro_implementation
      generated_member: "static func main() async throws"
    RouteMarkerMacro:
      kind: macro_implementation
      generated_peers: []
      used_by:
        - "@GET"
        - "@POST"
        - "@PUT"
        - "@PATCH"
        - "@DELETE"
        - "@HEAD"
        - "@OPTIONS"
        - "@GROUP"

runtime_rules:
  route_priority:
    - literal
    - parameter
    - wildcard
  path_parameter_prefix: ":"
  typed_path_parameter_policy: "Parameters.require(_:as:) and Parameters.get(_:as:) use ParameterDecodable; missing required and invalid values map to 400; UUID is deferred."
  macro_path_parameter_policy: "@Path parameters are marker wrappers; @DaylilyServer validates route membership and lowers them into Parameters.require(_:as:) plus RouteInputMetadata.path(...). Optional path inputs are rejected at compile time."
  default_path_policy: "Daylily provides recommended defaults, not mandatory application architecture. Runtime APIs are first-class; macros are convenience syntax; built-in helpers such as Dependencies must remain optional."
  macro_limit_policy: "Macro limitations must stay macro limitations. Applications may use runtime DSL, custom composition roots, and their own service wiring when macro or helper defaults do not fit."
  query_and_header_input_policy: "Request.query uses ordered QueryParameters that preserve repeated names and raw query text; Headers uses ordered HeaderField storage that preserves repeated fields; typed require/get remains convenience lookup. Required @Query/@Header inputs lower to req.query.require/req.headers.require; optional T?, Optional<T>, and Swift.Optional<T> inputs lower to the corresponding get with wrapped-type metadata and required: false. Missing optional values become nil; invalid present values remain 400. RouteInputMetadata.query/header describe both forms. Optional path inputs are rejected at compile time."
  macro_json_body_policy: "@Body parameters are the preferred marker wrappers in DaylilyJSON; @DaylilyServer lowers them into try await req.json(Type.self) plus RouteBodyMetadata.json(...). @JSONBody remains as a compatibility alias spelling with the same lowering. The raw one-shot request body type is RequestBody."
  lifecycle_policy: "Application lifecycle phases are configure, boot, started, shutdown, cleanup. Application.run binds lifecycle to transport; Application.respond(to:) does not run lifecycle. The default NIO server quiesces/drains on SIGINT/SIGTERM and force-closes when its run task is cancelled. DaylilyServiceLifecycle adapts Application into a ServiceLifecycle Service without replacing lifecycle hooks or creating a ServiceGroup. Managed service lifecycle is designed around future ApplicationService and Application.service(_:), with Application owning lifecycle and Dependencies remaining lookup-only."
  dependencies_policy: "Dependencies is an app-wide concrete and keyed Sendable registry in DaylilyCore. Application.respond(to:) stamps dependencies onto each request. Missing required dependencies map to 500 Internal Server Error. Protocol-oriented and same-type multi-instance lookup uses typed DependencyKey<Value>; direct protocol metatype lookup is not the preferred surface. @Dependency lowers keyed handler parameters to Request.dependencies.require(key). Managed service lifecycle is designed around future ApplicationService but not implemented."
  server_configuration_policy: "ServerConfiguration is NIO-free and equatable. Header/upload/grace Duration? defaults are 15/30/10 seconds; nil disables the corresponding deadline. Upload idle time excludes transport backpressure and abandoned bodies; inbound deadlines do not limit handlers or response producers. Signals and ServiceLifecycle shutdown quiesce and drain connections; Task cancellation force-closes. Observers are separate optional run/initializer arguments. ServiceLifecycle disables transport signal ownership by default."
  test_client_policy: "TestClient is an in-memory helper in DaylilyTesting; it calls Application.respond(to:) directly and does not use transport. TestRequest and response assertions are testing helpers, not runtime behavior."
  route_metadata_policy: "Route metadata lives in DaylilyCore and is exposed through Route.describe(...) and Application.describeRoutes(); it does not affect routing and is the source of truth for OpenAPI generation."
  openapi_policy: "DaylilyOpenAPI maps Application.describeRoutes() into minimal OpenAPI documents; deep Swift schema derivation and richer operation metadata are separate tasks."
  wildcard_prefix: "*"
  current_body_model: "RequestBody one-shot API with NIO true streaming bridge and in-process buffered RequestBody.bytes support"
  future_body_model: "higher-level upload helpers"
  middleware_order: "application -> router dispatch -> group -> route -> handler"
  middleware_body_policy: "middleware can read RequestBody, but RequestBody remains one-shot and no automatic replay occurs"
  explicit_buffered_body_policy: "withBufferedBody consumes the original RequestBody, buffers under an explicit limit, creates a one-shot replacement RequestBody.bytes value, and does not enable automatic replay"
  observability_policy: "DaylilyCore owns transport-free ResponseTransferEvent/Outcome/Observer. DaylilyObservability owns request ID/logging plus console and in-memory transfer observers. NIO freezes exactly one terminal event on its event loop and asynchronously awaits the nonthrowing sink outside it; shutdown does not wait for sink completion. Bytes count successful body flushes and duration excludes handler time. Optional DaylilySwiftLog directly depends on Core and Observability, adapts both request logs and transfer events, and never bootstraps LoggingSystem. Transport event delivery is admitted through a server-wide bounded gate; excess newest events are dropped and counted. Delivery counters are lock-protected across threads, while terminal selection/body-byte accounting stays on the event loop."
  ecosystem_adapter_policy: "SwiftLog, ServiceLifecycle, Swift HTTP Types, and Swift OpenAPI Generator integrations live in optional modules and are not re-exported by Daylily. DaylilyHTTPTypes adapts boundary types while DaylilyCore keeps Daylily-owned Request/Response models and does not import HTTPTypes. DaylilyOpenAPITransport adapts OpenAPIRuntime ServerTransport registrations while DaylilyCore does not import OpenAPIRuntime."
  errors:
    response_error: "status + reason"
    abort: "ResponseError conformer"
    body_error: "ResponseError conformer"
    parameter_error: "ResponseError conformer"
    unknown: "500 Internal Server Error"
    missing_route: "404 Not Found"

invariants:
  - "DaylilyCore does not import NIO."
  - "User-facing APIs do not expose NIO types."
  - "Request.body is DaylilyCore.RequestBody."
  - "RequestBody consumption is one-shot."
  - "Runtime APIs are the ground truth."
  - "Macros lower into runtime APIs."
  - "Default framework paths must not become mandatory application architecture."
  - "Macro limitations must not become runtime limitations."
  - "swift build passes."
  - "swift test passes."
  - "swift run starts the server."
  - "swift run HelloDaylily --check passes."
  - "Public API changes update AIDEV."
  - "Tasks are the smallest commit/push unit."
  - "Steps are reviewable but are not committed or pushed independently."

