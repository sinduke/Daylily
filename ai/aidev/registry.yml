      over_limit_mapping: "BodyError.tooLarge -> 413 Payload Too Large"
      buffering: "in-memory only for first version"
      automatic_replay: "not allowed"
    non_goals:
      - "automatic body replay"
      - "hidden middleware buffering"
      - "file-backed buffering"
      - "multipart parsing"
      - "JSON/Content abstraction"
      - "streaming replay"
  request_logging_middleware:
    status: implemented
    epic: "0013-observability-middleware"
    task: "0013-001-request-logging-middleware"
    module: DaylilyObservability
    public_api:
      - RequestLog
      - RequestLogSink
      - RequestLoggingMiddleware
      - ConsoleRequestLogSink
      - InMemoryRequestLogSink
    decisions:
      - "Observability helpers live outside DaylilyCore"
      - "Request logging is implemented as normal middleware"
      - "Logs include method, path, and final status"
      - "Successful downstream responses record response.status"
      - "ResponseError values record error.status and are rethrown"
      - "Unknown thrown errors record 500 Internal Server Error and are rethrown"
      - "No logging backend, metrics backend, tracing SDK, or transport dependency is required"
    non_goals:
      - "request id"
      - "latency timing"
      - "OpenTelemetry"
      - "structured logging framework commitment"
      - "metrics backend integration"
  request_id_and_timing:
    status: implemented
    epic: "0013-observability-middleware"
    task: "0013-002-request-id-and-timing"
    module: DaylilyObservability
    public_api:
      - RequestIDGenerator
      - RequestIDHeaders
      - RequestIDs
      - RequestIDMiddleware
      - "Request.daylilyRequestID"
      - "Request.correlationID"
      - "Request.withRequestIDs(requestID:correlationID:)"
      - "Request.with(headers:)"
      - "RequestLog.requestID"
      - "RequestLog.correlationID"
      - "RequestLog.durationNanoseconds"
      - "RequestLog.errorReason"
    decisions:
      - "Daylily always generates its own request ID for each request."
      - "Generated request IDs use the dl_<UUID> shape."
      - "Incoming x-request-id is external correlation data, not Daylily-owned uniqueness."
      - "Responses always include x-daylily-request-id."
      - "Responses preserve incoming x-request-id when present."
      - "Responses write generated requestID to x-request-id only when incoming x-request-id is absent."
      - "RequestLog.correlationID stays nil when x-request-id was populated only for compatibility."
      - "RequestLoggingMiddleware measures elapsed time around next.respond(to:) and stores nanoseconds."
      - "RequestLoggingMiddleware records public error reasons for 4xx and 5xx responses."
      - "Request.with(headers:) preserves method, path, query, parameters, and one-shot body storage."
      - "UUID generation stays outside DaylilyCore."
    non_goals:
      - "OpenTelemetry"
      - "trace/span model"
      - "metrics backend"
      - "Server-Timing response header"
      - "automatic outgoing client propagation"
  route_metadata_runtime:
    status: implemented
    epic: "0014-openapi-metadata"
    task: "0014-001-route-metadata-runtime"
    module: DaylilyCore
    public_api:
      - RouteMetadata
      - RouteInputLocation
      - RouteInputMetadata
      - RouteBodyMetadata
      - RouteResponseMetadata
      - RouteDescription
      - "Route.metadata"
      - "Route.withMetadata(_:)"
      - "Route.describe(...)"
      - "Router.describeRoutes()"
      - "Application.describeRoutes()"
    decisions:
      - "OpenAPI metadata starts in the runtime route model"
      - "Metadata describes routes but does not affect matching or handler execution"
      - "Group prefixing and middleware attachment preserve route metadata"
      - "Type names are strings in the first route metadata slice"
      - "Deep schema derivation and richer OpenAPI operation coverage are separate tasks"
  openapi_schema_mvp:
    status: implemented
    epic: "0014-openapi-metadata"
    task: "0014-002-openapi-schema-mvp"
    module: DaylilyOpenAPI
    public_api:
      - OpenAPIDocument
      - OpenAPIInfo
      - OpenAPIOperation
      - OpenAPIParameter
      - OpenAPIRequestBody
      - OpenAPIResponse
      - OpenAPIMediaType
      - OpenAPISchema
      - OpenAPIBuilder
      - "Application.openAPI(title:version:openapi:)"
    decisions:
      - "OpenAPI generation lives outside DaylilyCore"
      - "Application.openAPI reads Application.describeRoutes()"
      - "Daylily :name path parameters map to OpenAPI {name} path segments"
      - "Path parameters are always required in OpenAPI output"
      - "Routes without response metadata get a default 200 OK response"
      - "Known scalar Swift type names map to simple OpenAPI schemas"
      - "Unknown Swift type names map to object schemas with x-swift-type"
      - "Deep schema derivation, security schemes, documentation UI, and client SDK generation are deferred"
  macro_metadata_bridge:
    status: implemented
    epic: "0014-openapi-metadata"
    task: "0014-003-macro-metadata-bridge"
    module: DaylilyMacros
    public_api: []
    lowering:
      - "@Path lowers into RouteInputMetadata.path(...)"
      - "@Query lowers into RouteInputMetadata.query(...)"
      - "@Header lowers into RouteInputMetadata.header(...)"
      - "@Body lowers into RouteBodyMetadata.json(...)"
      - "@JSONBody lowers into RouteBodyMetadata.json(...) as a compatibility alias spelling"
      - "Generated routes call Route.describe(inputs:requestBody:) when typed input metadata exists"
    decisions:
      - "No new public macros are introduced"
      - "Macro metadata uses the same runtime metadata model as handwritten routes"
      - "Runtime extraction behavior is unchanged"
      - "Summary, description, tags, response inference, and deep schemas are deferred"
  macro_and_openapi_http_verbs:
    status: implemented
    epic: "0015-http-verbs-beta-closure"
    task: "0015-002-macro-and-openapi-http-verbs"
    modules:
      - Daylily
      - DaylilyMacros
      - DaylilyOpenAPI
      - HelloDaylily
    public_api:
      - "@PUT"
      - "@PATCH"
      - "@DELETE"
      - "@HEAD"
      - "@OPTIONS"
    lowering:
      - "@PUT lowers to runtime Put"
      - "@PATCH lowers to runtime Patch"
      - "@DELETE lowers to runtime Delete"
      - "@HEAD lowers to runtime Head"
      - "@OPTIONS lowers to runtime Options"
      - "Macro typed inputs still lower into runtime extraction and route metadata"
    decisions:
      - "Macros remain marker sugar collected by @DaylilyServer."
      - "OpenAPI generation continues to read Application.describeRoutes()."
      - "OpenAPI method keys come from HTTPMethod.rawValue.lowercased()."
      - "HEAD and OPTIONS remain explicit route methods only."
      - "No automatic HEAD to GET fallback is introduced."
      - "No automatic OPTIONS Allow response is introduced."
  formal_test_target:
    status: implemented
    task: "0016-001-formal-test-target"
    modules:
      - DaylilyCheckSuite
      - DaylilyTests
      - HelloDaylily
    public_commands:
      - "swift test"
      - "swift run HelloDaylily --check"
    decisions:
      - "Swift Testing is the formal test target style."
      - "DaylilyCheckSuite owns shared behavior checks."
      - "HelloDaylily --check delegates to DaylilyCheckSuite."
      - "DaylilyTests calls DaylilyCheckSuite so formal tests and executable checks stay aligned."
      - "Swift Testing is provided by the selected Xcode toolchain, not by a package dependency."
      - "If Command Line Tools cannot locate Testing, use DEVELOPER_DIR to point at an installed Xcode."

