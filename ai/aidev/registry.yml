        - "json(_:required:)"
    RouteResponseMetadata:
      kind: struct
      conforms:
        - Equatable
        - Sendable
      properties:
        - "status: Status"
        - "contentType: String?"
        - "typeName: String?"
      factories:
        - "response(_:contentType:type:)"
