        - "public func requireBody(_ expected: String) throws"
        - "public func requireJSON<Value: Decodable & Equatable>(_ expected: Value, as type: Value.Type = Value.self) throws"
        - "public func collectBody(upTo: ByteCount) async throws -> [UInt8]"
        - "public func bodyString(upTo: ByteCount) async throws -> String"
        - "public func requireBody(_: String, upTo: ByteCount) async throws"
        - "public func json<Value: Decodable>(_: Value.Type, upTo: ByteCount) async throws -> Value"
        - "public func requireJSON<Value: Decodable & Equatable>(_: Value, as: Value.Type, upTo: ByteCount) async throws"
