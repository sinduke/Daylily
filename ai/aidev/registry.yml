project:
  name: Daylily
  package: Daylily
  summary: "AI-native web framework for Swift"
  license: MIT
  license_file: LICENSE
  swift_tools_version: "6.0"
  current_phase: "daylily_testing_request_builders"
  authoritative_ai_entry:
    - AIDEV.md
    - ai/aidev/start-here.md
  default_run: "swift run"
  check_command: "swift run HelloDaylily --check"
  build_command: "swift build"
  ci_workflow: ".github/workflows/ci.yml"
  ci_checkout_action: "actions/checkout@v6"

work_model:
  hierarchy:
    - epic
    - task
    - step
  epic_directory: "ai/epics"
  task_directory: "ai/tasks"
  epic_file_format: "NNNN-short-kebab-name.md"
  task_file_format: "NNNN-XXX-short-kebab-name.md"
  step_format: "NNNN-XXX.n"
  commit_unit: task
  rules:
    - "Epics are planning containers, not direct implementation units."
    - "Tasks are the smallest commit/push unit."
    - "Steps live inside task files as checklists."
    - "Step completion may be reviewed and fixed but must not be committed or pushed independently."
    - "Do not create A/B/C task files for sub-steps."

dependencies:
  swift-nio:
    url: "https://github.com/apple/swift-nio.git"
    requirement: "from 2.74.0"
    resolved: "2.100.0"
  swift-syntax:
    url: "https://github.com/swiftlang/swift-syntax.git"
    requirement: "from 603.0.0-latest"
    resolved: "603.0.1"

source_reading_policy:
  aidev_is_authoritative: true
  source_reading_allowed_for:
    - exact_edits
    - compiler_errors
    - implementation_mismatch_checks
  source_reading_not_required_for:
    - project_understanding
    - architecture_planning
    - public_api_policy
    - extension_strategy

products:
  Daylily:
    kind: library
    role: user_facing_reexport
    responsibility:
      - reexport_core
      - reexport_json
      - reexport_nio_transport
      - provide_application_run
      - expose_route_macros
    depends_on:
      - DaylilyCore
      - DaylilyJSON
      - DaylilyMacros
      - DaylilyNIO
  DaylilyJSON:
    kind: library
    role: json_helpers
    responsibility:
      - decode_json_request_bodies
      - encode_json_responses
      - keep_foundation_json_out_of_core
    depends_on:
      - DaylilyCore
      - Foundation
  DaylilyMacros:
    kind: macro
    role: macro_implementation
    responsibility:
      - implement_DaylilyServer
      - implement_GET_marker
      - implement_POST_marker
      - implement_GROUP_marker
      - lower_macro_routes_to_runtime_dsl
    depends_on:
      - SwiftCompilerPlugin
      - SwiftSyntax
      - SwiftSyntaxBuilder
      - SwiftSyntaxMacros
  DaylilyCore:
    kind: library
    role: runtime_core
    responsibility:
      - application_runtime
      - route_model
      - router_matching
      - request_response_models
      - body_model
      - middleware_runtime
      - response_conversion
      - path_parameters
      - basic_errors
    depends_on: []
    allowed_imports:
      - Swift Standard Library
    forbidden_imports:
      - NIO
      - NIOCore
      - NIOHTTP1
      - NIOPosix
    public_api_must_not_expose:
      - EventLoopFuture
      - Channel
      - ChannelHandler
      - ChannelHandlerContext
      - ByteBuffer
  DaylilyNIO:
    kind: library
    role: nio_transport
    responsibility:
      - bind_http_server
      - create_daylily_request_after_nio_head
      - stream_nio_body_chunks_into_daylily_body
      - apply_bounded_body_buffering_and_backpressure
      - translate_daylily_response_to_nio_response
      - bridge_async_responder_to_event_loop
    depends_on:
      - DaylilyCore
      - NIOCore
      - NIOHTTP1
      - NIOPosix
  DaylilyTesting:
    kind: library
    role: testing_helpers
    responsibility:
      - provide_transport_free_test_client
      - call_application_respond_directly
      - support_in_memory_request_response_checks
    depends_on:
      - DaylilyCore
    forbidden_imports:
      - NIO
      - NIOCore
      - NIOHTTP1
      - NIOPosix
  HelloDaylily:
    kind: executable
    role: example_and_checks
    responsibility:
      - default_server_for_swift_run
      - smoke_routes
      - lightweight_behavior_checks
    depends_on:
      - Daylily
      - DaylilyCore
      - DaylilyTesting

implemented_features:
  runtime_dsl:
    status: implemented
    entry_points:
      - Application
      - Get
      - Post
      - Group
  path_parameters:
    status: implemented
    syntax: ":name"
    type: String
  typed_path_extraction_runtime:
    status: implemented
    epic: "0010-typed-handler-inputs"
    task: "0010-001-typed-path-extraction-runtime"
    module: DaylilyCore
    public_api:
      - ParameterDecodable
      - ParameterError
      - "Parameters.require(_:as:)"
      - "Parameters.get(_:as:)"
    supported_types:
      - String
      - Int
      - Double
      - Bool
    decisions:
      - "untyped lookup remains optional String"
      - "missing required path parameter maps to 400 Bad Request"
      - "invalid typed path parameter maps to 400 Bad Request"
      - "UUID is deferred to avoid a Foundation dependency in DaylilyCore"
  path_macro_mvp:
    status: implemented
    epic: "0010-typed-handler-inputs"
    task: "0010-002-path-macro-mvp"
    module: DaylilyMacros
    public_api:
      - "@Path"
    lowering:
      - "bare @Path uses the Swift local parameter name"
      - "@Path(\"name\") maps to an explicit route parameter name"
      - "@DaylilyServer lowers @Path parameters into Parameters.require(_:as:)"
    supported_with:
      - "@GET"
      - "@POST"
      - "@GROUP"
      - "optional Request parameter"
    decisions:
      - "@Path is a public property-wrapper marker in DaylilyCore"
      - "@Path names must match :name route segments in the full route path"
      - "missing and invalid values keep ParameterError 400 mappings"
      - "@Body, @Query, @Header, optional path values, and UUID remain out of scope"
  daylily_testing_minimal_client:
    status: implemented
    epic: "0011-daylily-testing"
    task: "0011-001-minimal-test-client"
    module: DaylilyTesting
    public_api:
      - TestClient
      - "TestClient.respond(to:)"
      - "TestClient.get(_:headers:)"
      - "TestClient.post(_:headers:body:)"
    decisions:
      - "TestClient calls Application.respond(to:) directly"
      - "DaylilyTesting depends on DaylilyCore only"
      - "TestClient is transport-free and opens no sockets"
      - "rich request builders and JSON assertions are deferred to 0011-002"
  nio_http_server:
    status: implemented
    protocol: HTTP/1.1
  buffered_body:
    status: implemented
    type: "Body.bytes(...) for in-process and manually constructed requests"
  aidev_contract:
    status: implemented
  aidev_self_contained_spec:
    status: implemented
  bilingual_readme:
    status: implemented
    files:
      - README.md
      - README.zh-CN.md
  macro_route_mvp:
    status: implemented
    task: "0003-001-macro-route-mvp"
    public_macros:
      - "@DaylilyServer"
      - "@GET"
      - "@POST"
    limitations:
      - "server type must be default-initializable with Self()"
      - "handlers must be instance methods"
      - "handlers may have zero parameters, one Request parameter, and @Path parameters"
  group_macro:
    status: implemented
    task: "0003-002-group-macro-mvp"
    public_macros:
      - "@GROUP"
    limitations:
      - "group types must be default-initializable"
      - "group handlers support the current route macro handler limits, including @Path"
  json_body_and_response:
    status: implemented
    task: "0004-001-json-body-and-response"
    module: DaylilyJSON
    public_api:
      - "Body.json(_:upTo:) for standard async JSON body decoding"
      - "Request.json(_:upTo:) as convenience sugar"
      - "JSON<Value> response wrapper"
    limitations:
      - "request content type is not enforced yet"
      - "all Encodable types do not automatically conform to ResponseConvertible"
  body_model_migration:
    status: implemented
    task: "0008-001-body-model-migration"
    public_api:
      - Body
      - BodyBytes
      - ByteChunk
      - ByteCount
      - BodyError
      - ResponseError
      - "Status.payloadTooLarge"
    decisions:
      - "Request.body is Body"
      - "Body is uniformly one-shot"
      - "Body uses shared storage so copied Body values cannot bypass one-shot consumption"
      - "BodyBytes yields ByteChunk"
      - "ByteChunk exposes bytes and count only"
      - "ByteCount supports bytes, kilobytes, megabytes, and gigabytes"
      - "ByteCount unit helpers are 1024-based"
      - "JSON body decode is async"
      - "request.body.json(...) is the standard JSON API"
      - "request.json(...) remains convenience sugar"
      - "default JSON body limit is 1 MB"
      - "body too large maps to 413 Payload Too Large"
      - "BodyError maps through ResponseError"
    limitations:
      - "transport stream construction is SPI, not normal user API"
  nio_true_streaming_bridge:
    status: implemented
    task: "0008-002-nio-true-streaming-bridge"
    file: "ai/tasks/0008-002-nio-true-streaming-bridge.md"
    depends_on:
      - "0008-001-body-model-migration"
    decisions:
      - "NIO request head creates Request with streaming Body"
      - "route handler starts before the full body is buffered"
      - "NIO body chunks feed BodyBytes in order"
      - "request end finishes BodyBytes"
      - "channel or protocol errors fail BodyBytes with BodyError.streamFailed"
      - "bounded Daylily buffering is enforced by BodyStreamStorage"
      - "DaylilyNIO pauses/resumes autoRead for practical backpressure"
      - "transport hooks use @_spi(Transport)"
      - "public user APIs do not expose NIO types"
    checks:
      - "streaming body yields chunks in order"
      - "stream failure throws BodyError.streamFailed"
      - "stream cancellation unblocks readers"
      - "chunked /upload/count smoke"
  middleware:
    status: implemented
    epic: "0009-middleware-system"
    task: "0009-001-middleware-runtime"
    public_api:
      - Middleware
      - Routes
      - "Application.middleware(_:)"
      - "Route.middleware(_:)"
      - "Routes.middleware(_:)"
    decisions:
      protocol_shape: "public protocol Middleware: Sendable { func handle(_ request: Request, next: Handler) async throws -> Response }"
      ordering: "application -> router dispatch -> group -> route -> handler"
      missing_route_behavior: "application middleware wraps missing-route responses; group and route middleware require a matched route"
      same_scope_order: "declaration order"
      short_circuit: "middleware may return Response without calling next"
      error_behavior: "thrown errors flow through Application.respond(to:) mappings"
      body_policy: "middleware may read Body, but Body remains one-shot and there is no automatic replay"
    limitations:
      - "macro middleware syntax"
      - "request context"
      - "dependency injection"
      - "production middleware stack"
  explicit_buffered_body_helper:
    status: implemented
    epic: "0009-middleware-system"
    task: "0009-002-explicit-buffered-body-helper"
    module: DaylilyCore
    public_api:
      - "public func Request.with(body: Body) -> Request"
      - "public func Request.withBufferedBody<R: Sendable>(upTo limit: ByteCount, _ operation: @Sendable (Request, [UInt8]) async throws -> R) async throws -> R"
    decisions:
      name: "withBufferedBody"
      ownership: "DaylilyCore first; future JSON/Content layers may wrap higher-level body helpers"
      replacement_body: "Body.bytes(collectedBytes)"
      replacement_body_policy: "still one-shot"
      limit: "required ByteCount"
      over_limit_mapping: "BodyError.tooLarge -> 413 Payload Too Large"
      buffering: "in-memory only for first version"
      automatic_replay: "not allowed"
    non_goals:
      - "automatic body replay"
      - "hidden middleware buffering"
      - "file-backed buffering"
      - "multipart parsing"
      - "JSON/Content abstraction"
      - "streaming replay"

planned_features:
  typed_handler_inputs:
    status: in-progress
    epic: "0010-typed-handler-inputs"
    completed:
      - "0010-001-typed-path-extraction-runtime"
      - "0010-002-path-macro-mvp"
    next_task: "0010-003-body-json-macro-runtime-bridge"
  daylily_testing:
    status: in-progress
    epic: "0011-daylily-testing"
    completed:
      - "0011-001-minimal-test-client"
    next_task: "0011-002-request-builders-and-json-assertions"
  openapi:
    status: future
  dependency_injection:
    status: future

public_api:
  Daylily:
    exports:
      - DaylilyCore
      - DaylilyJSON
      - DaylilyNIO
    Application.run:
      signature: "public func run(host: String = \"127.0.0.1\", port: Int = 8080) async throws"
      parameters:
        host: "bind host"
        port: "bind port"
    macros:
      DaylilyServer:
        signature: "public macro DaylilyServer()"
        role: "generate static main and Application route registration"
      GET:
        signature: "public macro GET(_ path: String)"
        role: "mark instance method as GET route"
      POST:
        signature: "public macro POST(_ path: String)"
        role: "mark instance method as POST route"
      GROUP:
        signature: "public macro GROUP(_ prefix: String)"
        role: "mark nested struct as route group"
  DaylilyTesting:
    TestClient:
      kind: struct
      conforms:
        - Sendable
      methods:
        - "public init(_ application: Application)"
        - "public func respond(to request: Request) async throws -> Response"
        - "public func get(_ path: String, headers: Headers = [:]) async throws -> Response"
        - "public func post(_ path: String, headers: Headers = [:], body: Body = .bytes([])) async throws -> Response"
        - "public func post(_ path: String, headers: Headers = [:], body: [UInt8]) async throws -> Response"
        - "public func post(_ path: String, headers: Headers = [:], body: String) async throws -> Response"
      contract: "Transport-free in-memory test client that calls Application.respond(to:) directly."
  DaylilyCore:
    Application:
      kind: struct
      conforms:
        - Sendable
      methods:
        - "public init(@RouteBuilder routes: () -> [Route])"
        - "public init(routes: [Route])"
        - "public init(routes: Routes)"
        - "public func middleware<M: Middleware>(_ middleware: M) -> Application"
        - "public func respond(to request: Request) async -> Response"
      contract: "Always returns a Response; runs application middleware around router dispatch; converts ResponseError and unknown errors."
    Route:
      kind: struct
      conforms:
        - Sendable
      properties:
        - "method: HTTPMethod"
        - "path: String"
        - "handler: Handler"
      methods:
        - "public func prefixed(with prefix: String) -> Route"
        - "public func middleware<M: Middleware>(_ middleware: M) -> Route"
      contract: "Normalizes paths and stores route handler plus route middleware."
    Routes:
      kind: struct
      conforms:
        - Sendable
      methods:
        - "public func middleware<M: Middleware>(_ middleware: M) -> Routes"
      contract: "Group route collection wrapper accepted by RouteBuilder; resolves group middleware before route middleware."
    Middleware:
      kind: protocol
      conforms:
        - Sendable
      methods:
        - "func handle(_ request: Request, next: Handler) async throws -> Response"
      contract: "Middleware can inspect Request, call next, transform Response, short-circuit, or throw."
    Request:
      kind: struct
      conforms:
        - Sendable
      properties:
        - "method: HTTPMethod"
        - "path: String"
        - "headers: Headers"
        - "body: Body"
        - "parameters: Parameters"
      methods:
        - "public init(method:path:headers:body: Body = .bytes([]), parameters: Parameters = Parameters())"
        - "public init(method:path:headers:body: [UInt8], parameters: Parameters = Parameters())"
        - "public func with(parameters: Parameters) -> Request"
        - "public func with(body: Body) -> Request"
        - "public func withBufferedBody<R: Sendable>(upTo limit: ByteCount, _ operation: @Sendable (Request, [UInt8]) async throws -> R) async throws -> R"
      contract: "DaylilyNIO creates streaming Body values through transport SPI; in-process callers may use Body.bytes(...); explicit body buffering uses withBufferedBody(upTo:_:)."
    Parameters:
      kind: struct
      conforms:
        - Equatable
        - Sendable
      methods:
        - "public init(_ storage: [String: String] = [:])"
        - "public subscript(_ name: String) -> String? { get }"
        - "public subscript(dynamicMember name: String) -> String? { get }"
        - "public func require<Value: ParameterDecodable>(_ name: String, as type: Value.Type = Value.self) throws -> Value"
        - "public func get<Value: ParameterDecodable>(_ name: String, as type: Value.Type = Value.self) throws -> Value?"
      contract: "Untyped path lookup returns optional String; typed lookup throws ParameterError for missing required or invalid values."
    ParameterDecodable:
      kind: protocol
      conforms:
        - Sendable
      methods:
        - "static var parameterTypeDescription: String { get }"
        - "static func decodeParameter(_ value: String) -> Self?"
      built_in_conformers:
        - String
        - Int
        - Double
        - Bool
    ParameterError:
      kind: enum
      conforms:
        - ResponseError
      cases:
        - "missing(name: String)"
        - "invalid(name: String, expected: String)"
      mappings:
        missing: "400 Missing path parameter: <name>"
        invalid: "400 Invalid path parameter <name>: expected <type>"
    Path:
      kind: propertyWrapper
      conforms:
        - Sendable
      generic: "Value: ParameterDecodable"
      properties:
        - "wrappedValue: Value"
      initializers:
        - "public init(wrappedValue: Value)"
        - "public init(wrappedValue: Value, _ name: String)"
      contract: "Marker for @DaylilyServer macro path input lowering; extraction is performed by Parameters.require(_:as:)."
    Body:
      kind: struct
      conforms:
        - Sendable
      methods:
        - "public static func bytes(_ bytes: [UInt8]) -> Body"
        - "public func collect(upTo limit: ByteCount) async throws -> [UInt8]"
        - "public func string(upTo limit: ByteCount) async throws -> String"
      properties:
        - "bytes: BodyBytes"
      contract: "One-shot body abstraction backed by shared storage."
      transport_spi:
        - "@_spi(Transport) public static func stream(bufferLimit: ByteCount = .megabytes(1)) -> BodyStream"
        - "@_spi(Transport) BodyStream"
        - "@_spi(Transport) BodyStreamWriter"
    BodyBytes:
      kind: struct
      conforms:
        - AsyncSequence
        - Sendable
      element: ByteChunk
    ByteChunk:
      kind: struct
      conforms:
        - Sendable
      properties:
        - "bytes: [UInt8]"
        - "count: Int"
      limitation: "Does not conform to Collection in first version."
    ByteCount:
      kind: struct
      conforms:
        - Comparable
        - Sendable
      properties:
        - "bytes: Int"
      factories:
        - "bytes(_ value: Int)"
        - "kilobytes(_ value: Int)"
        - "megabytes(_ value: Int)"
        - "gigabytes(_ value: Int)"
      unit_base: 1024
    ResponseError:
      kind: protocol
      methods:
        - "var status: Status { get }"
        - "var reason: String { get }"
      conformers:
        - Abort
        - BodyError
        - ParameterError
    BodyError:
      kind: enum
      conforms:
        - ResponseError
      cases:
        - alreadyConsumed
        - "tooLarge(limit: ByteCount)"
        - streamFailed
        - invalidEncoding
      mappings:
        alreadyConsumed: "500 Request body already consumed"
        tooLarge: "413 Request body too large"
        streamFailed: "400 Request body stream failed"
        invalidEncoding: "400 Invalid UTF-8 body"
    Response:
      kind: struct
      conforms:
        - Sendable
      properties:
        - "status: Status"
        - "headers: Headers"
        - "body: [UInt8]"
    ResponseConvertible:
      kind: protocol
      methods:
        - "func toResponse() async throws -> Response"
      conformers:
        - Response
        - Status
        - String
        - "JSON<Value>"
    Handler:
      kind: struct
      role: "uniform async throwing request-to-response wrapper"
    Router:
      kind: struct
      role: "method and path matcher"
    route_dsl:
      functions:
        Get:
          overloads:
            - "(_ path: String, _ handler: @escaping @Sendable () async throws -> R) -> Route"
            - "(_ path: String, _ handler: @escaping @Sendable (Request) async throws -> R) -> Route"
        Post:
          overloads:
            - "(_ path: String, _ handler: @escaping @Sendable () async throws -> R) -> Route"
            - "(_ path: String, _ handler: @escaping @Sendable (Request) async throws -> R) -> Route"
        Group:
          signature: "(_ prefix: String, @RouteBuilder routes: () -> [Route]) -> Routes"
  DaylilyJSON:
    JSON:
      kind: struct
      generic: "Value: Encodable & Sendable"
      conforms:
        - ResponseConvertible
      initializer: "public init(_ value: Value, status: Status = .ok, headers: Headers = [:])"
      behavior:
        - "encodes with Foundation JSONEncoder"
        - "sets content-type to application/json unless already present"
    Body_json:
      kind: extension_method
      signature: "public func json<Value: Decodable>(_ type: Value.Type, upTo limit: ByteCount) async throws -> Value"
      behavior:
        - "collects Body with explicit limit"
        - "decodes collected bytes with Foundation JSONDecoder"
        - "throws Abort(.badRequest, reason: \"Invalid JSON body\") on decode failure"
    Request_json:
      kind: extension_method
      signature: "public func json<Value: Decodable>(_ type: Value.Type, upTo limit: ByteCount = .megabytes(1)) async throws -> Value"
      behavior:
        - "delegates to Body.json(_:upTo:)"
        - "default JSON body limit is 1 MB"
      limitations:
        - "does not enforce request content type yet"
  DaylilyNIO:
    NIOHTTPServer:
      kind: struct
      role: transport
    NIOServerConfiguration:
      kind: struct
      defaults:
        host: "127.0.0.1"
        port: 8080
  DaylilyMacros:
    DaylilyServerMacro:
      kind: macro_implementation
      generated_member: "static func main() async throws"
    RouteMarkerMacro:
      kind: macro_implementation
      generated_peers: []
      used_by:
        - "@GET"
        - "@POST"
        - "@GROUP"

runtime_rules:
  route_priority:
    - literal
    - parameter
    - wildcard
  path_parameter_prefix: ":"
  typed_path_parameter_policy: "Parameters.require(_:as:) and Parameters.get(_:as:) use ParameterDecodable; missing required and invalid values map to 400; UUID is deferred."
  macro_path_parameter_policy: "@Path parameters are marker wrappers; @DaylilyServer validates route membership and lowers them into Parameters.require(_:as:)."
  test_client_policy: "TestClient is an in-memory helper in DaylilyTesting; it calls Application.respond(to:) directly and does not use transport."
  wildcard_prefix: "*"
  current_body_model: "Body one-shot API with NIO true streaming bridge and in-process buffered Body.bytes support"
  future_body_model: "response body streaming and higher-level upload helpers"
  middleware_order: "application -> router dispatch -> group -> route -> handler"
  middleware_body_policy: "middleware can read Body, but Body remains one-shot and no automatic replay occurs"
  explicit_buffered_body_policy: "withBufferedBody consumes the original Body, buffers under an explicit limit, creates a one-shot replacement Body.bytes value, and does not enable automatic replay"
  errors:
    response_error: "status + reason"
    abort: "ResponseError conformer"
    body_error: "ResponseError conformer"
    parameter_error: "ResponseError conformer"
    unknown: "500 Internal Server Error"
    missing_route: "404 Not Found"

invariants:
  - "DaylilyCore does not import NIO."
  - "User-facing APIs do not expose NIO types."
  - "Request.body is DaylilyCore.Body."
  - "Body consumption is one-shot."
  - "Runtime APIs are the ground truth."
  - "Macros lower into runtime APIs."
  - "swift build passes."
  - "swift run starts the server."
  - "swift run HelloDaylily --check passes."
  - "Public API changes update AIDEV."
  - "Tasks are the smallest commit/push unit."
  - "Steps are reviewable but are not committed or pushed independently."

aidev_files:
  entry:
    - AIDEV.md
    - ai/aidev/start-here.md
  epics:
    - ai/epics/0001-runtime-foundation.md
    - ai/epics/0002-aidev-system.md
    - ai/epics/0003-routing-macro-system.md
    - ai/epics/0004-json-system.md
    - ai/epics/0008-body-system.md
    - ai/epics/0009-middleware-system.md
    - ai/epics/0010-typed-handler-inputs.md
    - ai/epics/0011-daylily-testing.md
    - ai/epics/0012-lifecycle-server-controls.md
    - ai/epics/0013-observability-middleware.md
    - ai/epics/0014-openapi-metadata.md
  tasks:
    - ai/tasks/0001-001-minimal-http-server.md
    - ai/tasks/0002-001-aidev-project-contract.md
    - ai/tasks/0002-002-aidev-self-contained-spec.md
