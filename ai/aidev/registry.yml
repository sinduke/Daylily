public_api:
  Daylily:
    exports:
      - DaylilyCore
      - DaylilyJSON
      - DaylilyNIO
      - DaylilyObservability
      - DaylilyOpenAPI
    Application.run:
      signatures:
        - "public func run(host: String = \"127.0.0.1\", port: Int = 8080, responseObserver: (any ResponseTransferObserver)? = nil) async throws"
        - "public func run(configuration: ServerConfiguration, responseObserver: (any ResponseTransferObserver)? = nil) async throws"
      parameters:
        host: "bind host"
        port: "bind port"
        configuration: "explicit server configuration"
        responseObserver: "optional terminal transfer observer; nil creates no delivery task"
    macros:
      DaylilyServer:
        signature: "public macro DaylilyServer()"
        role: "generate static main, optional dependency configuration hook, and Application route registration"
      GET:
        signature: "public macro GET(_ path: String)"
        role: "mark instance method as GET route"
      POST:
        signature: "public macro POST(_ path: String)"
        role: "mark instance method as POST route"
      PUT:
        signature: "public macro PUT(_ path: String)"
        role: "mark instance method as PUT route"
      PATCH:
        signature: "public macro PATCH(_ path: String)"
        role: "mark instance method as PATCH route"
      DELETE:
        signature: "public macro DELETE(_ path: String)"
        role: "mark instance method as DELETE route"
      HEAD:
        signature: "public macro HEAD(_ path: String)"
        role: "mark instance method as HEAD route"
      OPTIONS:
        signature: "public macro OPTIONS(_ path: String)"
        role: "mark instance method as OPTIONS route"
      GROUP:
        signature: "public macro GROUP(_ prefix: String)"
        role: "mark nested struct as route group"
  DaylilyObservability:
    RequestLog:
      kind: struct
      conforms:
        - Equatable
        - Sendable
      properties:
        - "method: HTTPMethod"
        - "path: String"
        - "status: Status"
        - "requestID: String?"
        - "correlationID: String?"
        - "durationNanoseconds: UInt64?"
        - "errorReason: String?"
      initializer: "public init(method: HTTPMethod, path: String, status: Status, requestID: String? = nil, correlationID: String? = nil, durationNanoseconds: UInt64? = nil, errorReason: String? = nil)"
    RequestIDGenerator:
      kind: typealias
      signature: "public typealias RequestIDGenerator = @Sendable () -> String"
    RequestIDHeaders:
      kind: enum
      constants:
        - "requestID = x-request-id"
        - "daylilyRequestID = x-daylily-request-id"
    RequestIDs:
      kind: enum
      methods:
        - "public static func generate() -> String"
    RequestIDMiddleware:
      kind: struct
      conforms:
        - Middleware
      initializer: "public init(generator: @escaping RequestIDGenerator = RequestIDs.generate)"
      contract: "Generates a Daylily-owned request ID, preserves external x-request-id as correlation data, and writes response ID headers."
    RequestLogSink:
      kind: protocol
      conforms:
        - Sendable
      methods:
        - "func record(_ log: RequestLog) async"
    RequestLoggingMiddleware:
      kind: struct
      generic: "Sink: RequestLogSink"
      conforms:
        - Middleware
      initializer: "public init(sink: Sink)"
      contract: "Records method, path, final status, request ID, external correlation ID, duration, and public error reason around downstream middleware/handler execution."
    ConsoleRequestLogSink:
      kind: struct
      conforms:
        - RequestLogSink
      methods:
        - "public init()"
        - "public func record(_ log: RequestLog) async"
    InMemoryRequestLogSink:
      kind: actor
      conforms:
        - RequestLogSink
      methods:
        - "public init()"
        - "public func record(_ log: RequestLog)"
        - "public func snapshot() -> [RequestLog]"
    InMemoryResponseTransferObserver:
      kind: actor
      conforms: [ResponseTransferObserver]
      initializer: "public init()"
      methods:
        - "public func record(_ event: ResponseTransferEvent)"
        - "public func snapshot() -> [ResponseTransferEvent]"
      contract: "Retains terminal events for tests/local inspection; retention is unbounded."
    ConsoleResponseTransferObserver:
      kind: struct
      conforms: [ResponseTransferObserver]
      initializer: "public init()"
      methods:
        - "public func record(_ event: ResponseTransferEvent) async"
      contract: "Prints terminal transfer outcome, body bytes and transfer duration separately from handler request logs."
  DaylilySwiftLog:
    SwiftLogResponseTransferObserver:
      kind: struct
      conforms: [ResponseTransferObserver]
      initializers:
        - "public init(logger: Logger)"
        - "public init(label: String = \"daylily.response.transfer\")"
      methods:
        - "public func record(_ event: ResponseTransferEvent) async"
      contract: "Completed/cancelled/failed map to info/notice/error independently of HTTP status. Records daylily.response.bytes_sent and daylily.response.transfer_duration_ns with optional request context; never bootstraps LoggingSystem."
    SwiftLogRequestLogSink:
      kind: struct
      conforms:
        - RequestLogSink
      initializers:
        - "public init(logger: Logger, level: SwiftLogRequestLogLevelStrategy = .statusBased, metadata: SwiftLogRequestLogMetadataStrategy = .default)"
        - "public init(label: String = \"daylily.request\", level: SwiftLogRequestLogLevelStrategy = .statusBased, metadata: SwiftLogRequestLogMetadataStrategy = .default)"
      methods:
        - "public func record(_ log: RequestLog) async"
      contract: "Adapts Daylily RequestLog values into SwiftLog Logger calls without replacing RequestLoggingMiddleware or bootstrapping LoggingSystem."
    SwiftLogRequestLogLevelStrategy:
      kind: struct
      conforms:
        - Sendable
      initializers:
        - "public init(_ selectLevel: @escaping @Sendable (RequestLog) -> Logger.Level)"
      constants:
        - "public static let statusBased"
      methods:
        - "public static func constant(_ level: Logger.Level) -> Self"
        - "public func level(for log: RequestLog) -> Logger.Level"
      contract: "Selects SwiftLog level for a RequestLog; default maps 1xx-3xx to info, 4xx to warning, and 5xx+ to error."
    SwiftLogRequestLogMetadataStrategy:
      kind: struct
      conforms:
        - Sendable
      initializers:
        - "public init(_ makeMetadata: @escaping @Sendable (RequestLog) -> Logger.Metadata)"
      constants:
        - "public static let default"
      methods:
        - "public func metadata(for log: RequestLog) -> Logger.Metadata"
      contract: "Maps RequestLog fields into SwiftLog metadata at the adapter boundary; default keys are namespaced with daylily.*."
  DaylilyServiceLifecycle:
    DaylilyApplicationService:
      kind: struct
      conforms:
        - Service
      initializers:
        - "public init(application: Application, configuration: ServerConfiguration = .serviceLifecycleDefault, responseObserver: (any ResponseTransferObserver)? = nil)"
      methods:
        - "public func run() async throws"
      contract: "Adapts Daylily Application into a ServiceLifecycle Service while preserving Application.run lifecycle order."
    Application:
      kind: extension
      methods:
        - "public func serviceLifecycleService(configuration: ServerConfiguration = .serviceLifecycleDefault, responseObserver: (any ResponseTransferObserver)? = nil) -> DaylilyApplicationService"
      contract: "Convenience helper for creating the optional ServiceLifecycle adapter service."
    ServerConfiguration:
      kind: extension
      constants:
        - "public static var serviceLifecycleDefault: ServerConfiguration"
      methods:
        - "public func withGracefulShutdownSignals(_ enabled: Bool) -> ServerConfiguration"
      contract: "Provides ServiceLifecycle-friendly server defaults and explicit signal policy toggling."
  DaylilyHTTPTypes:
    DaylilyHTTPTypesError:
      kind: enum
      conforms:
        - Error
        - Equatable
        - Sendable
      cases:
        - "invalidMethod(String)"
        - "invalidHeaderName(String)"
        - "invalidHeaderValue(name: String, value: String)"
        - "invalidStatusCode(Int)"
        - "invalidReasonPhrase(String)"
      contract: "Reports values that cannot be represented by Swift HTTP Types without a lossy conversion."
    Request:
      kind: extension
      methods:
        - "public init(httpTypesRequest: HTTPRequest, body: RequestBody = .bytes([]), parameters: Parameters = Parameters(), dependencies: Dependencies = Dependencies())"
        - "public func httpTypesRequest() throws -> HTTPRequest"
      contract: "Converts between Daylily Request and Swift HTTP Types HTTPRequest while preserving method token, raw target, repeated headers, query parameters, and pseudo fields."
    Response:
      kind: extension
      methods:
        - "public init(httpTypesResponse: HTTPResponse, body: [UInt8] = [])"
        - "public func httpTypesResponse() throws -> HTTPResponse"
      contract: "Converts between Daylily Response and Swift HTTP Types HTTPResponse while preserving status, reason phrase, and repeated headers."
    Headers:
      kind: extension
      methods:
        - "public init(httpTypesHeaderFields: HTTPFields)"
        - "public func httpTypesHeaderFields() throws -> HTTPFields"
      contract: "Converts ordered Daylily HeaderField values to/from Swift HTTP Types HTTPFields and preserves dynamic table indexing strategy hints."
  DaylilyOpenAPITransport:
    OpenAPIResponseBodyPolicy:
      kind: enum
      conforms: [Equatable, Sendable]
      cases: [stream, "collect(upTo: ByteCount)"]
    DaylilyOpenAPITransportError:
      kind: enum
      conforms:
        - Error
        - Equatable
        - Sendable
      cases:
        - "invalidHTTPMethod(String)"
        - "unsupportedPathTemplate(String)"
        - "duplicatePathParameter(String)"
        - "missingPathParameter(String)"
      contract: "Reports registration and route metadata errors for generated server handler registrations."
    DaylilyOpenAPITransport:
      kind: final_class
      conforms:
        - ServerTransport
        - "@unchecked Sendable"
      initializers:
        - "public init(responseBodyPolicy: OpenAPIResponseBodyPolicy = .stream)"
        - "public convenience init(responseBodyBufferLimit: ByteCount)"
      methods:
        - "public func register(_:method:path:) throws"
        - "public func routes() -> [Route]"
        - "public func application(dependencies configureDependencies: @Sendable (inout Dependencies) -> Void = { _ in }) -> Application"
      contract: "Adapts Swift OpenAPI Generator server registrations into Daylily routes, using DaylilyHTTPTypes for request/response conversion and demand-driven response streaming with optional bounded buffering."
  DaylilyOpenAPI:
    OpenAPIComponents:
      kind: struct
      conforms: [Codable, Equatable, Sendable]
      properties: ["schemas: [String: OpenAPISchema]", "securitySchemes: [String: OpenAPISecurityScheme]"]
      methods: ["init(schemas: [String: OpenAPISchema] = [:], securitySchemes: [String: OpenAPISecurityScheme] = [:])", "registerSchema(_:named:)", "registerSecurityScheme(_:named:)"]
    OpenAPISecurityScheme:
      kind: struct
      conforms: [Codable, Equatable, Sendable]
      methods: ["bearer(format: String? = nil)", "basic", "apiKey(name: String, location: APIKeyLocation = .header)"]
      properties: ["type: String", "scheme: String?", "bearerFormat: String?", "name: String?", "location: APIKeyLocation?"]
      contract: "Explicit bearer/basic/api-key definitions; APIKeyLocation is header/query/cookie."
    OpenAPIValidationError:
      kind: struct
      conforms: [Error, Equatable, Sendable, CustomStringConvertible]
      properties: ["location: String", "reason: String", "description: String"]
      methods: ["init(location: String, reason: String)"]
    Application_validatedOpenAPI:
      kind: extension_method
      signature: "validatedOpenAPI(title: String, version: String, openapi: String = \"3.1.0\", components: OpenAPIComponents = .init()) throws -> OpenAPIDocument"
    OpenAPIDocument:
      kind: struct
      conforms:
        - Codable
        - Equatable
        - Sendable
      properties:
        - "openapi: String"
        - "info: OpenAPIInfo"
        - "paths: [String: [String: OpenAPIOperation]]"
        - "components: OpenAPIComponents?"
      methods:
        - "public func validate() throws"
    OpenAPIInfo:
      kind: struct
      conforms:
        - Codable
        - Equatable
        - Sendable
      properties:
        - "title: String"
        - "version: String"
    OpenAPIOperation:
      kind: struct
      conforms:
        - Codable
        - Equatable
        - Sendable
      properties:
        - "summary: String?"
        - "description: String?"
        - "operationID: String?"
        - "tags: [String]"
        - "parameters: [OpenAPIParameter]"
        - "requestBody: OpenAPIRequestBody?"
        - "responses: [String: OpenAPIResponse]"
    OpenAPIParameter:
      kind: struct
      conforms:
        - Codable
        - Equatable
        - Sendable
      properties:
        - "name: String"
        - "location: String"
        - "required: Bool"
        - "schema: OpenAPISchema"
      coding:
        location: "in"
    OpenAPIRequestBody:
      kind: struct
      conforms:
        - Codable
        - Equatable
        - Sendable
      properties:
        - "required: Bool"
        - "content: [String: OpenAPIMediaType]"
    OpenAPIResponse:
      kind: struct
      conforms:
        - Codable
        - Equatable
        - Sendable
      properties:
        - "description: String"
        - "content: [String: OpenAPIMediaType]?"
    OpenAPIMediaType:
      kind: struct
      conforms:
        - Codable
        - Equatable
        - Sendable
      properties:
        - "schema: OpenAPISchema"
    OpenAPISchema:
      nullable_contract: "nullable() returns a concrete schema accepting null; isNullable reads type/enum intersection without resolving references. Presence is controlled independently by the enclosing object required list; nullable reference wrappers are invalid."
      kind: struct
      conforms:
        - Codable
        - Equatable
        - Sendable
      properties:
        - "type: String"
        - "format: String?"
        - "swiftType: String?"
        - "properties: [String: OpenAPISchema]?"
        - "required: [String]?"
        - "items: OpenAPISchema?"
        - "enumValues: [String]?"
        - "reference: String?"
      methods:
        - "public static func object(properties: [String: OpenAPISchema], required: [String] = []) -> Self"
        - "public static func array(items: OpenAPISchema) -> Self"
        - "public func nullable() -> Self"
        - "public var isNullable: Bool { get }"
        - "public static func string(enum values: [String]? = nil) -> Self"
        - "public static func reference(_ componentName: String) -> Self"
      coding:
        swiftType: "x-swift-type"
    OpenAPIBuilder:
      kind: struct
