verification:
  ci:
    provider: GitHub Actions
    workflow: ".github/workflows/ci.yml"
    checkout_action: "actions/checkout@v6"
    triggers:
      - push_to_main
      - pull_request_to_main
      - workflow_dispatch
    runners:
      macos: "macos-latest"
      linux: "ubuntu-latest with swift:6.3.2-noble container"
    steps:
      - "swift --version"
      - "swift package resolve"
      - "swift build"
      - "swift test"
      - "swift run HelloDaylily --check"
  required:
    - "swift build"
    - "swift test"
    - "swift run HelloDaylily --check"
  swift_testing_toolchain_note: "Swift Testing is provided by the selected Xcode toolchain. If xcode-select points at Command Line Tools and swift test reports no such module Testing, use DEVELOPER_DIR=/Applications/Xcode-26.5.0.app/Contents/Developer swift test locally."
  server_smoke:
    start: "swift run"
    requests:
      - "curl http://127.0.0.1:8080/hello"
      - "curl http://127.0.0.1:8080/users/42"
      - "curl 'http://127.0.0.1:8080/search?term=daylily&page=1'"
      - "curl -H 'x-daylily: ships' http://127.0.0.1:8080/headers"
      - "curl -X POST --data 'hi' http://127.0.0.1:8080/echo"
      - "curl -X PUT --data 'full' http://127.0.0.1:8080/users/42"
      - "curl -X PATCH --data 'partial' http://127.0.0.1:8080/users/42"
      - "curl -i -X DELETE http://127.0.0.1:8080/users/42"
      - "curl -I http://127.0.0.1:8080/health"
      - "curl -i -X OPTIONS http://127.0.0.1:8080/health"
      - "printf 'abcdef' | curl --http1.1 -H 'Transfer-Encoding: chunked' -H 'Content-Length:' --data-binary @- http://127.0.0.1:8080/upload/count"
      - "perl -e 'print \"a\" x 70000' | curl -X POST --data-binary @- http://127.0.0.1:8080/echo"
      - "curl http://127.0.0.1:8080/json/health"
      - "curl -X POST -H 'content-type: application/json' --data '{\"message\":\"hi\"}' http://127.0.0.1:8080/json/echo"
    cleanup: "stop the HelloDaylily process"

