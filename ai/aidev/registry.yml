project:
  name: Daylily
  package: Daylily
  summary: "AI-native web framework for Swift"
  license: MIT
  license_file: LICENSE
  swift_tools_version: "6.0"
  current_phase: "beta_closure"
  authoritative_ai_entry:
    - AIDEV.md
    - ai/aidev/start-here.md
  default_run: "swift run"
  check_command: "swift run HelloDaylily --check"
  test_command: "swift test"
  xcode_toolchain_test_command: "DEVELOPER_DIR=/Applications/Xcode-26.5.0.app/Contents/Developer swift test"
  build_command: "swift build"
  ci_workflow: ".github/workflows/ci.yml"
  ci_checkout_action: "actions/checkout@v6"

work_model:
  hierarchy:
    - epic
    - task
    - step
  epic_directory: "ai/epics"
  task_directory: "ai/tasks"
  epic_file_format: "NNNN-short-kebab-name.md"
  task_file_format: "NNNN-XXX-short-kebab-name.md"
  step_format: "NNNN-XXX.n"
  commit_unit: task
  rules:
    - "Epics are planning containers, not direct implementation units."
    - "Tasks are the smallest commit/push unit."
    - "Steps live inside task files as checklists."
    - "Step completion may be reviewed and fixed but must not be committed or pushed independently."
    - "Do not create A/B/C task files for sub-steps."

dependencies:
  swift-nio:
    url: "https://github.com/apple/swift-nio.git"
    requirement: "from 2.74.0"
    resolved: "2.100.0"
  swift-syntax:
    url: "https://github.com/swiftlang/swift-syntax.git"
    requirement: "from 603.0.0-latest"
    resolved: "603.0.1"

source_reading_policy:
  aidev_is_authoritative: true
  source_reading_allowed_for:
    - exact_edits
    - compiler_errors
    - implementation_mismatch_checks
  source_reading_not_required_for:
    - project_understanding
    - architecture_planning
    - public_api_policy
    - extension_strategy

products:
  Daylily:
    kind: library
    role: user_facing_reexport
    responsibility:
      - reexport_core
      - reexport_json
      - reexport_nio_transport
      - reexport_observability
      - reexport_openapi
      - provide_application_run
      - expose_route_macros
    depends_on:
      - DaylilyCore
      - DaylilyJSON
      - DaylilyMacros
      - DaylilyNIO
      - DaylilyObservability
      - DaylilyOpenAPI
  DaylilyJSON:
    kind: library
    role: json_helpers
    responsibility:
      - decode_json_request_bodies
      - encode_json_responses
      - provide_json_body_marker
      - keep_foundation_json_out_of_core
    depends_on:
      - DaylilyCore
      - Foundation
  DaylilyMacros:
    kind: macro
    role: macro_implementation
    responsibility:
      - implement_DaylilyServer
      - implement_GET_marker
      - implement_POST_marker
      - implement_GROUP_marker
      - lower_macro_routes_to_runtime_dsl
      - lower_typed_handler_inputs_to_runtime_apis
      - lower_typed_handler_inputs_to_route_metadata
    depends_on:
      - SwiftCompilerPlugin
      - SwiftSyntax
      - SwiftSyntaxBuilder
      - SwiftSyntaxMacros
  DaylilyCore:
    kind: library
    role: runtime_core
    responsibility:
      - application_runtime
      - route_model
      - route_metadata
      - router_matching
      - request_response_models
      - body_model
      - middleware_runtime
      - lifecycle_runtime
      - server_configuration
      - response_conversion
      - path_parameters
      - query_parameters
      - typed_headers
      - basic_errors
    depends_on: []
    allowed_imports:
      - Swift Standard Library
    forbidden_imports:
      - NIO
      - NIOCore
      - NIOHTTP1
      - NIOPosix
    public_api_must_not_expose:
      - EventLoopFuture
      - Channel
      - ChannelHandler
      - ChannelHandlerContext
      - ByteBuffer
  DaylilyNIO:
    kind: library
    role: nio_transport
    responsibility:
      - bind_http_server
      - expose_started_callback_after_bind
      - create_daylily_request_after_nio_head
      - stream_nio_body_chunks_into_daylily_body
      - apply_bounded_body_buffering_and_backpressure
      - translate_daylily_response_to_nio_response
      - bridge_async_responder_to_event_loop
    depends_on:
      - DaylilyCore
      - NIOCore
      - NIOHTTP1
      - NIOPosix
  DaylilyObservability:
    kind: library
    role: observability_helpers
    responsibility:
      - provide_request_id_middleware
      - provide_request_id_generator
      - provide_request_logging_middleware
      - provide_request_log_sink_protocol
      - provide_console_request_log_sink
      - provide_in_memory_request_log_sink_for_checks
      - record_request_duration_and_public_error_reason
      - keep_logging_and_tracing_out_of_core
    depends_on:
      - DaylilyCore
      - Foundation
    forbidden_imports:
      - NIO
      - NIOCore
      - NIOHTTP1
      - NIOPosix
  DaylilyOpenAPI:
    kind: library
    role: openapi_document_generation
    responsibility:
      - map_route_descriptions_to_openapi_documents
      - expose_openapi_dtos
      - provide_application_openapi_helper
      - keep_openapi_generation_out_of_core
    depends_on:
      - DaylilyCore
    forbidden_imports:
      - NIO
      - NIOCore
      - NIOHTTP1
      - NIOPosix
  DaylilyTesting:
    kind: library
    role: testing_helpers
    responsibility:
      - provide_transport_free_test_client
      - provide_test_request_builder
      - provide_response_assertion_helpers
      - provide_json_test_helpers
      - call_application_respond_directly
      - support_in_memory_request_response_checks
    depends_on:
      - DaylilyCore
      - Foundation
    forbidden_imports:
      - NIO
      - NIOCore
      - NIOHTTP1
      - NIOPosix
  DaylilyCheckSuite:
    kind: target
    role: shared_behavior_checks
    responsibility:
      - provide_DaylilyChecks_run
      - share_check_payloads_with_example_and_tests
      - keep_executable_checks_and_formal_tests_in_sync
    depends_on:
      - Daylily
      - DaylilyCore
      - DaylilyTesting
  HelloDaylily:
    kind: executable
    role: example_and_check_entrypoint
    responsibility:
      - default_server_for_swift_run
      - smoke_routes
      - delegate_check_command_to_DaylilyCheckSuite
    depends_on:
      - Daylily
      - DaylilyCheckSuite
  DaylilyTests:
    kind: test_target
    role: formal_swift_testing_target
    responsibility:
      - run_DaylilyCheckSuite_with_swift_test
      - verify_DaylilyTesting_without_opening_ports
    depends_on:
      - Daylily
      - DaylilyCheckSuite
      - DaylilyTesting

implemented_features:
  runtime_dsl:
    status: implemented
    entry_points:
      - Application
      - Get
      - Post
      - Put
      - Patch
      - Delete
      - Head
      - Options
      - Group
  path_parameters:
    status: implemented
    syntax: ":name"
    type: String
  typed_path_extraction_runtime:
    status: implemented
    epic: "0010-typed-handler-inputs"
    task: "0010-001-typed-path-extraction-runtime"
    module: DaylilyCore
    public_api:
      - ParameterDecodable
      - ParameterError
      - "Parameters.require(_:as:)"
      - "Parameters.get(_:as:)"
    supported_types:
      - String
      - Int
      - Double
      - Bool
    decisions:
      - "untyped lookup remains optional String"
      - "missing required path parameter maps to 400 Bad Request"
      - "invalid typed path parameter maps to 400 Bad Request"
      - "UUID is deferred to avoid a Foundation dependency in DaylilyCore"
  path_macro_mvp:
    status: implemented
    epic: "0010-typed-handler-inputs"
    task: "0010-002-path-macro-mvp"
    module: DaylilyMacros
    public_api:
      - "@Path"
    lowering:
      - "bare @Path uses the Swift local parameter name"
      - "@Path(\"name\") maps to an explicit route parameter name"
      - "@DaylilyServer lowers @Path parameters into Parameters.require(_:as:)"
      - "@DaylilyServer lowers @Path parameters into RouteInputMetadata.path(...)"
    supported_with:
      - "@GET"
      - "@POST"
      - "@GROUP"
      - "optional Request parameter"
    decisions:
      - "@Path is a public property-wrapper marker in DaylilyCore"
      - "@Path names must match :name route segments in the full route path"
      - "missing and invalid values keep ParameterError 400 mappings"
      - "JSON body macro input is delivered separately as @JSONBody in 0010-003"
      - "@Query, @Header, optional path values, and UUID remain out of scope"
  json_body_macro_bridge:
    status: implemented
    epic: "0010-typed-handler-inputs"
    task: "0010-003-body-json-macro-runtime-bridge"
    modules:
      - DaylilyJSON
      - DaylilyMacros
    public_api:
      - "@JSONBody"
    lowering:
      - "@DaylilyServer lowers @JSONBody parameters into try await req.json(Type.self)"
      - "@DaylilyServer lowers @JSONBody parameters into RouteBodyMetadata.json(...)"
      - "one @JSONBody parameter is allowed per handler"
      - "Request plus @JSONBody is allowed"
    decisions:
      - "@JSONBody is a public property-wrapper marker in DaylilyJSON"
      - "runtime decoding remains Request.json(_:upTo:) in DaylilyJSON"
      - "default @JSONBody limit is the existing request.json(...) default of 1 MB"
      - "invalid JSON keeps Abort(.badRequest, reason: \"Invalid JSON body\")"
      - "true @Body spelling is deferred because Body is already Daylily's raw request body type"
      - "attached peer macros cannot be applied to function parameters"
  query_and_header_inputs:
    status: implemented
    epic: "0010-typed-handler-inputs"
    task: "0010-004-query-and-header-inputs"
    modules:
      - DaylilyCore
      - DaylilyMacros
      - DaylilyNIO
    public_api:
      - QueryParameters
      - QueryParameterError
      - HeaderError
      - "@Query"
      - "@Header"
      - "Request.query"
      - "Headers.require(_:as:)"
      - "Headers.get(_:as:)"
    lowering:
      - "@DaylilyServer lowers @Query parameters into req.query.require(_:as:)"
      - "@DaylilyServer lowers @Header parameters into req.headers.require(_:as:)"
      - "@DaylilyServer lowers @Query parameters into RouteInputMetadata.query(...)"
      - "@DaylilyServer lowers @Header parameters into RouteInputMetadata.header(...)"
    decisions:
      - "@Query and @Header are public property-wrapper markers in DaylilyCore"
      - "runtime extraction remains the source of truth"
      - "query parsing happens in Request initialization"
      - "Request.path stores the route path without query text"
      - "NIO passes the full request target to Request so query text is available"
      - "query parsing supports &, name=value, empty values, plus-as-space, percent-decoded UTF-8, and last value wins"
      - "missing and invalid query/header values map to source-specific 400 responses"
      - "optional macro values, repeated query values, and cookies are deferred"
  application_lifecycle_mvp:
    status: implemented
    epic: "0012-lifecycle-server-controls"
    task: "0012-001-application-lifecycle-mvp"
    modules:
      - DaylilyCore
      - Daylily
      - DaylilyNIO
    public_api:
      - LifecycleOperation
      - LifecyclePhase
      - "Application.lifecycle(_:_:)"
      - "Application.configure(_:)"
      - "Application.boot(_:)"
      - "Application.started(_:)"
      - "Application.shutdown(_:)"
      - "Application.cleanup(_:)"
      - "Application.runLifecycle(_:)"
      - "NIOHTTPServer.run(started:)"
    lifecycle_order:
      - configure
      - boot
      - "NIO bind"
      - started
      - "server close"
      - shutdown
      - cleanup
    decisions:
      - "Lifecycle hooks run in registration order within each phase"
      - "Application.respond(to:) does not run lifecycle hooks"
      - "Application.run calls started only after NIO bind succeeds"
      - "shutdown and cleanup are attempted if server run fails after boot"
      - "lifecycle APIs do not expose NIO types"
  graceful_shutdown:
    status: implemented
    epic: "0012-lifecycle-server-controls"
    task: "0012-002-graceful-shutdown"
    module: DaylilyNIO
    behavior:
      - "SIGINT and SIGTERM close the server channel"
      - "Application.run can continue into shutdown and cleanup lifecycle phases"
    decisions:
      - "signal handling is transport-owned"
      - "NIO channel types are not exposed to user APIs"
      - "request draining and shutdown timeouts are deferred"
  server_configuration:
    status: implemented
    epic: "0012-lifecycle-server-controls"
    task: "0012-003-server-configuration"
    modules:
      - DaylilyCore
      - Daylily
      - DaylilyNIO
    public_api:
      - ServerConfiguration
      - "Application.run(configuration:)"
      - "NIOServerConfiguration.init(_:)"
    defaults:
      host: "127.0.0.1"
      port: 8080
      backlog: 256
      reuseAddress: true
      maxMessagesPerRead: 16
      gracefulShutdownSignals: true
    decisions:
      - "ServerConfiguration is NIO-free and lives in DaylilyCore"
      - "Application.run(host:port:) remains convenience sugar"
      - "Application.run(configuration:) is the explicit server control API"
      - "NIOServerConfiguration mirrors the active NIO transport controls"
  daylily_testing_minimal_client:
    status: implemented
    epic: "0011-daylily-testing"
    task: "0011-001-minimal-test-client"
    module: DaylilyTesting
    public_api:
      - TestClient
      - "TestClient.respond(to:)"
      - "TestClient.get(_:headers:)"
      - "TestClient.post(_:headers:body:)"
    decisions:
      - "TestClient calls Application.respond(to:) directly"
      - "0011-001 kept DaylilyTesting to DaylilyCore only"
      - "TestClient is transport-free and opens no sockets"
      - "rich request builders and JSON assertions are delivered by 0011-002"
  daylily_testing_request_builders_and_json_assertions:
    status: implemented
    epic: "0011-daylily-testing"
    task: "0011-002-request-builders-and-json-assertions"
    module: DaylilyTesting
    public_api:
      - TestRequest
      - TestFailure
      - "TestClient.send(_:)"
      - "TestClient.postJSON(_:headers:body:)"
      - "Response.json(_:)"
      - "Response.requireStatus(_:)"
      - "Response.requireBody(_:)"
      - "Response.requireJSON(_:as:)"
    decisions:
      - "TestRequest builds in-memory Request values"
      - "TestRequest.withJSON encodes with Foundation JSONEncoder"
      - "TestRequest.withJSON sets content-type to application/json when absent"
      - "Response JSON helpers decode with Foundation JSONDecoder"
      - "Response assertion helpers throw TestFailure"
      - "DaylilyTesting remains transport-free and NIO-free"
      - "runtime JSON behavior remains owned by DaylilyJSON"
  runtime_and_testing_http_verbs:
    status: implemented
    epic: "0015-http-verbs-beta-closure"
    task: "0015-001-runtime-and-testing-http-verbs"
    modules:
      - DaylilyCore
      - DaylilyTesting
      - HelloDaylily
    public_api:
      - "HTTPMethod.head"
      - "HTTPMethod.options"
      - Put
      - Patch
      - Delete
      - Head
      - Options
      - "TestClient.put(_:headers:body:)"
      - "TestClient.patch(_:headers:body:)"
      - "TestClient.delete(_:headers:)"
      - "TestClient.head(_:headers:)"
      - "TestClient.options(_:headers:)"
      - "TestRequest.put(_:headers:body:)"
      - "TestRequest.patch(_:headers:body:)"
      - "TestRequest.delete(_:headers:)"
      - "TestRequest.head(_:headers:)"
      - "TestRequest.options(_:headers:)"
    decisions:
      - "PUT, PATCH, DELETE, HEAD, and OPTIONS are first-class runtime route DSL functions."
      - "HEAD and OPTIONS are explicit route methods only in this slice."
      - "No automatic HEAD to GET fallback is introduced."
      - "No automatic OPTIONS Allow response is introduced."
      - "DELETE has no special default response; examples may return Status.noContent."
      - "Macro support is deferred to 0015-002."
  nio_http_server:
    status: implemented
    protocol: HTTP/1.1
  buffered_body:
    status: implemented
    type: "Body.bytes(...) for in-process and manually constructed requests"
  aidev_contract:
    status: implemented
  aidev_self_contained_spec:
    status: implemented
  bilingual_readme:
    status: implemented
    files:
      - README.md
      - README.zh-CN.md
  macro_route_mvp:
    status: implemented
    task: "0003-001-macro-route-mvp"
    public_macros:
      - "@DaylilyServer"
      - "@GET"
      - "@POST"
      - "@PUT"
      - "@PATCH"
      - "@DELETE"
      - "@HEAD"
      - "@OPTIONS"
    limitations:
      - "server type must be default-initializable with Self()"
      - "handlers must be instance methods"
      - "handlers may have zero parameters, one Request parameter, @Path, @Query, @Header, and one @JSONBody parameter"
  group_macro:
    status: implemented
    task: "0003-002-group-macro-mvp"
    public_macros:
      - "@GROUP"
    limitations:
      - "group types must be default-initializable"
      - "group handlers support the current route macro handler limits, including @Path"
  json_body_and_response:
    status: implemented
    task: "0004-001-json-body-and-response"
    module: DaylilyJSON
    public_api:
      - "Body.json(_:upTo:) for standard async JSON body decoding"
      - "Request.json(_:upTo:) as convenience sugar"
      - "JSON<Value> response wrapper"
    limitations:
      - "request content type is not enforced yet"
      - "all Encodable types do not automatically conform to ResponseConvertible"
  body_model_migration:
    status: implemented
    task: "0008-001-body-model-migration"
    public_api:
      - Body
      - BodyBytes
      - ByteChunk
      - ByteCount
      - BodyError
      - ResponseError
      - "Status.payloadTooLarge"
    decisions:
      - "Request.body is Body"
      - "Body is uniformly one-shot"
      - "Body uses shared storage so copied Body values cannot bypass one-shot consumption"
      - "BodyBytes yields ByteChunk"
      - "ByteChunk exposes bytes and count only"
      - "ByteCount supports bytes, kilobytes, megabytes, and gigabytes"
      - "ByteCount unit helpers are 1024-based"
      - "JSON body decode is async"
      - "request.body.json(...) is the standard JSON API"
      - "request.json(...) remains convenience sugar"
      - "default JSON body limit is 1 MB"
      - "body too large maps to 413 Payload Too Large"
      - "BodyError maps through ResponseError"
    limitations:
      - "transport stream construction is SPI, not normal user API"
  nio_true_streaming_bridge:
    status: implemented
    task: "0008-002-nio-true-streaming-bridge"
    file: "ai/tasks/0008-002-nio-true-streaming-bridge.md"
    depends_on:
      - "0008-001-body-model-migration"
    decisions:
      - "NIO request head creates Request with streaming Body"
      - "route handler starts before the full body is buffered"
      - "NIO body chunks feed BodyBytes in order"
      - "request end finishes BodyBytes"
      - "channel or protocol errors fail BodyBytes with BodyError.streamFailed"
      - "bounded Daylily buffering is enforced by BodyStreamStorage"
      - "DaylilyNIO pauses/resumes autoRead for practical backpressure"
      - "transport hooks use @_spi(Transport)"
      - "public user APIs do not expose NIO types"
    checks:
      - "streaming body yields chunks in order"
      - "stream failure throws BodyError.streamFailed"
      - "stream cancellation unblocks readers"
      - "chunked /upload/count smoke"
  middleware:
    status: implemented
    epic: "0009-middleware-system"
    task: "0009-001-middleware-runtime"
    public_api:
      - Middleware
      - Routes
      - "Application.middleware(_:)"
      - "Route.middleware(_:)"
      - "Routes.middleware(_:)"
    decisions:
      protocol_shape: "public protocol Middleware: Sendable { func handle(_ request: Request, next: Handler) async throws -> Response }"
      ordering: "application -> router dispatch -> group -> route -> handler"
      missing_route_behavior: "application middleware wraps missing-route responses; group and route middleware require a matched route"
      same_scope_order: "declaration order"
      short_circuit: "middleware may return Response without calling next"
      error_behavior: "thrown errors flow through Application.respond(to:) mappings"
      body_policy: "middleware may read Body, but Body remains one-shot and there is no automatic replay"
    limitations:
      - "macro middleware syntax"
      - "request context"
      - "dependency injection"
      - "production middleware stack"
  explicit_buffered_body_helper:
    status: implemented
    epic: "0009-middleware-system"
    task: "0009-002-explicit-buffered-body-helper"
    module: DaylilyCore
    public_api:
      - "public func Request.with(body: Body) -> Request"
      - "public func Request.withBufferedBody<R: Sendable>(upTo limit: ByteCount, _ operation: @Sendable (Request, [UInt8]) async throws -> R) async throws -> R"
    decisions:
      name: "withBufferedBody"
      ownership: "DaylilyCore first; future JSON/Content layers may wrap higher-level body helpers"
      replacement_body: "Body.bytes(collectedBytes)"
      replacement_body_policy: "still one-shot"
      limit: "required ByteCount"
      over_limit_mapping: "BodyError.tooLarge -> 413 Payload Too Large"
      buffering: "in-memory only for first version"
      automatic_replay: "not allowed"
    non_goals:
      - "automatic body replay"
      - "hidden middleware buffering"
      - "file-backed buffering"
      - "multipart parsing"
      - "JSON/Content abstraction"
      - "streaming replay"
  request_logging_middleware:
    status: implemented
    epic: "0013-observability-middleware"
    task: "0013-001-request-logging-middleware"
    module: DaylilyObservability
    public_api:
      - RequestLog
      - RequestLogSink
      - RequestLoggingMiddleware
      - ConsoleRequestLogSink
      - InMemoryRequestLogSink
    decisions:
      - "Observability helpers live outside DaylilyCore"
      - "Request logging is implemented as normal middleware"
      - "Logs include method, path, and final status"
      - "Successful downstream responses record response.status"
      - "ResponseError values record error.status and are rethrown"
      - "Unknown thrown errors record 500 Internal Server Error and are rethrown"
      - "No logging backend, metrics backend, tracing SDK, or transport dependency is required"
    non_goals:
      - "request id"
      - "latency timing"
      - "OpenTelemetry"
      - "structured logging framework commitment"
      - "metrics backend integration"
  request_id_and_timing:
    status: implemented
    epic: "0013-observability-middleware"
    task: "0013-002-request-id-and-timing"
    module: DaylilyObservability
    public_api:
      - RequestIDGenerator
      - RequestIDHeaders
      - RequestIDs
      - RequestIDMiddleware
      - "Request.daylilyRequestID"
      - "Request.correlationID"
      - "Request.withRequestIDs(requestID:correlationID:)"
      - "Request.with(headers:)"
      - "RequestLog.requestID"
      - "RequestLog.correlationID"
      - "RequestLog.durationNanoseconds"
      - "RequestLog.errorReason"
    decisions:
      - "Daylily always generates its own request ID for each request."
      - "Generated request IDs use the dl_<UUID> shape."
      - "Incoming x-request-id is external correlation data, not Daylily-owned uniqueness."
      - "Responses always include x-daylily-request-id."
      - "Responses preserve incoming x-request-id when present."
      - "Responses write generated requestID to x-request-id only when incoming x-request-id is absent."
      - "RequestLog.correlationID stays nil when x-request-id was populated only for compatibility."
      - "RequestLoggingMiddleware measures elapsed time around next.respond(to:) and stores nanoseconds."
      - "RequestLoggingMiddleware records public error reasons for 4xx and 5xx responses."
      - "Request.with(headers:) preserves method, path, query, parameters, and one-shot body storage."
      - "UUID generation stays outside DaylilyCore."
    non_goals:
      - "OpenTelemetry"
      - "trace/span model"
      - "metrics backend"
      - "Server-Timing response header"
      - "automatic outgoing client propagation"
  route_metadata_runtime:
    status: implemented
    epic: "0014-openapi-metadata"
    task: "0014-001-route-metadata-runtime"
    module: DaylilyCore
    public_api:
      - RouteMetadata
      - RouteInputLocation
      - RouteInputMetadata
      - RouteBodyMetadata
      - RouteResponseMetadata
      - RouteDescription
      - "Route.metadata"
      - "Route.withMetadata(_:)"
      - "Route.describe(...)"
      - "Router.describeRoutes()"
      - "Application.describeRoutes()"
    decisions:
      - "OpenAPI metadata starts in the runtime route model"
      - "Metadata describes routes but does not affect matching or handler execution"
      - "Group prefixing and middleware attachment preserve route metadata"
      - "Type names are strings in the first route metadata slice"
      - "Deep schema derivation and richer OpenAPI operation coverage are separate tasks"
  openapi_schema_mvp:
    status: implemented
    epic: "0014-openapi-metadata"
    task: "0014-002-openapi-schema-mvp"
    module: DaylilyOpenAPI
    public_api:
      - OpenAPIDocument
      - OpenAPIInfo
      - OpenAPIOperation
      - OpenAPIParameter
      - OpenAPIRequestBody
      - OpenAPIResponse
      - OpenAPIMediaType
      - OpenAPISchema
      - OpenAPIBuilder
      - "Application.openAPI(title:version:openapi:)"
    decisions:
      - "OpenAPI generation lives outside DaylilyCore"
      - "Application.openAPI reads Application.describeRoutes()"
      - "Daylily :name path parameters map to OpenAPI {name} path segments"
      - "Path parameters are always required in OpenAPI output"
      - "Routes without response metadata get a default 200 OK response"
      - "Known scalar Swift type names map to simple OpenAPI schemas"
      - "Unknown Swift type names map to object schemas with x-swift-type"
      - "Deep schema derivation, security schemes, documentation UI, and client SDK generation are deferred"
  macro_metadata_bridge:
    status: implemented
    epic: "0014-openapi-metadata"
    task: "0014-003-macro-metadata-bridge"
    module: DaylilyMacros
    public_api: []
    lowering:
      - "@Path lowers into RouteInputMetadata.path(...)"
      - "@Query lowers into RouteInputMetadata.query(...)"
      - "@Header lowers into RouteInputMetadata.header(...)"
      - "@JSONBody lowers into RouteBodyMetadata.json(...)"
      - "Generated routes call Route.describe(inputs:requestBody:) when typed input metadata exists"
    decisions:
      - "No new public macros are introduced"
      - "Macro metadata uses the same runtime metadata model as handwritten routes"
      - "Runtime extraction behavior is unchanged"
      - "Summary, description, tags, response inference, and deep schemas are deferred"
  macro_and_openapi_http_verbs:
    status: implemented
    epic: "0015-http-verbs-beta-closure"
    task: "0015-002-macro-and-openapi-http-verbs"
    modules:
      - Daylily
      - DaylilyMacros
      - DaylilyOpenAPI
      - HelloDaylily
    public_api:
      - "@PUT"
      - "@PATCH"
      - "@DELETE"
      - "@HEAD"
      - "@OPTIONS"
    lowering:
      - "@PUT lowers to runtime Put"
      - "@PATCH lowers to runtime Patch"
      - "@DELETE lowers to runtime Delete"
      - "@HEAD lowers to runtime Head"
      - "@OPTIONS lowers to runtime Options"
      - "Macro typed inputs still lower into runtime extraction and route metadata"
    decisions:
      - "Macros remain marker sugar collected by @DaylilyServer."
      - "OpenAPI generation continues to read Application.describeRoutes()."
      - "OpenAPI method keys come from HTTPMethod.rawValue.lowercased()."
      - "HEAD and OPTIONS remain explicit route methods only."
      - "No automatic HEAD to GET fallback is introduced."
      - "No automatic OPTIONS Allow response is introduced."
  formal_test_target:
    status: implemented
    task: "0016-001-formal-test-target"
    modules:
      - DaylilyCheckSuite
      - DaylilyTests
      - HelloDaylily
    public_commands:
      - "swift test"
      - "swift run HelloDaylily --check"
    decisions:
      - "Swift Testing is the formal test target style."
      - "DaylilyCheckSuite owns shared behavior checks."
      - "HelloDaylily --check delegates to DaylilyCheckSuite."
      - "DaylilyTests calls DaylilyCheckSuite so formal tests and executable checks stay aligned."
      - "Swift Testing is provided by the selected Xcode toolchain, not by a package dependency."
      - "If Command Line Tools cannot locate Testing, use DEVELOPER_DIR to point at an installed Xcode."

