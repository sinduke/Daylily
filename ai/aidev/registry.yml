        - CustomStringConvertible
      properties:
        - "rawValue: String"
      constants:
        - "delete = DELETE"
        - "get = GET"
        - "head = HEAD"
        - "options = OPTIONS"
        - "patch = PATCH"
        - "post = POST"
        - "put = PUT"
        - "connect = CONNECT"
        - "trace = TRACE"
