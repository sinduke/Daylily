name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  macos:
    name: macOS Build, Test, and Check
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Show Swift Version
        run: swift --version

      - name: Resolve Dependencies
        run: swift package resolve

      - name: Build
        run: swift build

      - name: Run Swift Tests
        run: swift test

      - name: Run Daylily Checks
        run: swift run HelloDaylily --check

      - name: Run Path Consumer Smoke
        run: scripts/consumer-smoke-test.sh --mode path

      - name: Run Release Consumer Smoke
        run: scripts/consumer-smoke-test.sh --mode release --version 0.1.0-alpha.1

      - name: Run Path Template Smoke
        run: scripts/template-smoke-test.sh --mode path

      - name: Run Release Template Smoke
        run: scripts/template-smoke-test.sh --mode release --version 0.1.0-alpha.1

  linux:
    name: Linux Build, Test, and Check
    runs-on: ubuntu-latest
    container: swift:6.3.2-noble

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Show Swift Version
        run: swift --version

      - name: Resolve Dependencies
        run: swift package resolve

      - name: Build
        run: swift build

      - name: Run Swift Tests
        run: swift test

      - name: Run Daylily Checks
        run: swift run HelloDaylily --check

      - name: Run Path Consumer Smoke
        run: scripts/consumer-smoke-test.sh --mode path

      - name: Run Release Consumer Smoke
        run: scripts/consumer-smoke-test.sh --mode release --version 0.1.0-alpha.1

      - name: Run Path Template Smoke
        run: scripts/template-smoke-test.sh --mode path

      - name: Run Release Template Smoke
        run: scripts/template-smoke-test.sh --mode release --version 0.1.0-alpha.1
