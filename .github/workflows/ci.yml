name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'ai/aidev/registry.yml'
  pull_request:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'ai/aidev/registry.yml'
  workflow_dispatch:
    inputs:
      release_version:
        description: Optional published version to validate with the complete current capability set
        required: false
        type: string
      business_trial_seconds:
        description: Sustained business deployment seconds (3600 for alpha.4 acceptance)
        required: false
        default: '60'
        type: string
      business_only:
        description: Run only the sustained business deployment against this ref
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  validate:
    if: ${{ !inputs.business_only }}
    name: ${{ matrix.platform }} · Swift 6.3.2 · ${{ matrix.suite }}
    runs-on: ${{ matrix.runner }}
    container: ${{ matrix.container }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        platform: [macOS, Linux]
        suite: ${{ fromJSON(inputs.release_version && '["core","path","revision","legacy","release"]' || '["core","path","revision","legacy"]') }}
        include:
          - platform: macOS
            runner: macos-26
            container: ''
            developer_directory: /Applications/Xcode_26.5.app/Contents/Developer
          - platform: Linux
            runner: ubuntu-24.04
            container: swift:6.3.2-noble
            developer_directory: ''
    defaults:
      run:
        shell: bash
    env:
      DEVELOPER_DIR: ${{ matrix.developer_directory }}
      SMOKE_SWIFT_VERSION: '6.3.2'
      VALIDATION_SUITE: ${{ matrix.suite }}
      RELEASE_VERSION: ${{ inputs.release_version }}

    steps:
      - name: Install Linux smoke dependencies
        if: matrix.platform == 'Linux'
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates curl git python3

      - name: Checkout exact candidate
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify pinned toolchain and prerequisites
        run: |
          # Container steps run as root against a checkout owned by the host
          # runner. Checkout's temporary HOME does not configure later shells.
          if [[ "$RUNNER_OS" == Linux ]]; then
            git config --global --add safe.directory "$GITHUB_WORKSPACE"
          fi
          source scripts/smoke-common.sh
          SMOKE_ARTIFACT_DIR="$RUNNER_TEMP/daylily-smoke"
          echo "SMOKE_ARTIFACT_DIR=$SMOKE_ARTIFACT_DIR" >> "$GITHUB_ENV"
          mkdir -p "$SMOKE_ARTIFACT_DIR"
          smoke_require_tools curl
          swift --version > "$SMOKE_ARTIFACT_DIR/toolchain.txt"
          git rev-parse HEAD > "$SMOKE_ARTIFACT_DIR/candidate-revision.txt"

      - name: Build, test, and run checks
        if: matrix.suite == 'core'
        run: |
          swift package resolve
          swift build
          swift test
          swift run --skip-build HelloDaylily --check
          python3 ai/evals/contracts/test_compatibility.py
          python3 scripts/test-sustained-http.py
          python3 ai/evals/repeated-changes/run_extended.py --baseline-only --repetitions 1 --jobs 2 --output "$SMOKE_ARTIFACT_DIR/ai-baselines"

      - name: Validate external packages
        if: matrix.suite != 'core'
        run: |
          case "$VALIDATION_SUITE" in
            path) source_args=(--mode path);;
            revision)
              # A Git URL checks SwiftPM source-control consumption of this exact
              # commit, including PR merge commits that have no published tag.
              source_args=(--mode revision --repo-url "file://$GITHUB_WORKSPACE" --revision "$(git rev-parse HEAD)")
              ;;
            legacy) source_args=(--mode release --version 0.1.0-alpha.1);;
            release) source_args=(--mode release --version "$RELEASE_VERSION");;
          esac
          profile=current
          if [[ "$VALIDATION_SUITE" == legacy ]]; then profile=legacy-alpha1; fi
          failed=0
          run_smoke() {
            local name="$1"
            shift
            "$@" --workdir "$SMOKE_ARTIFACT_DIR/$name" --keep 2>&1 | tee "$SMOKE_ARTIFACT_DIR/$name.log" || failed=1
          }
          run_smoke consumer scripts/consumer-smoke-test.sh "${source_args[@]}" --profile "$profile"
          run_smoke template scripts/template-smoke-test.sh "${source_args[@]}"
          if [[ "$VALIDATION_SUITE" != legacy ]]; then
            run_smoke commerce scripts/example-smoke-test.sh "${source_args[@]}"
            run_smoke openapi scripts/openapi-smoke-test.sh "${source_args[@]}"
          fi
          if [[ "$VALIDATION_SUITE" == path || "$VALIDATION_SUITE" == revision || "$VALIDATION_SUITE" == release ]]; then
            run_smoke contract scripts/contract-regression-test.sh "${source_args[@]}"
          fi
          if [[ "$VALIDATION_SUITE" == path ]]; then
            run_smoke ai-exercises scripts/ai-exercises-smoke-test.sh --mode path
          fi
          exit "$failed"

      - name: Preserve resolver and smoke diagnostics
        if: always() && env.SMOKE_ARTIFACT_DIR != ''
        uses: actions/upload-artifact@v4
        with:
          name: validation-${{ matrix.platform }}-${{ matrix.suite }}
          path: |
            ${{ env.SMOKE_ARTIFACT_DIR }}/*.txt
            ${{ env.SMOKE_ARTIFACT_DIR }}/*.log
            ${{ env.SMOKE_ARTIFACT_DIR }}/*/Package.resolved
            ${{ env.SMOKE_ARTIFACT_DIR }}/*/dependency-record.json
            ${{ env.SMOKE_ARTIFACT_DIR }}/*/*-diff.json
            ${{ env.SMOKE_ARTIFACT_DIR }}/*/*.log
            ${{ env.SMOKE_ARTIFACT_DIR }}/ai-baselines/summary.json
            ${{ env.SMOKE_ARTIFACT_DIR }}/ai-baselines/*/result.json
            ${{ env.SMOKE_ARTIFACT_DIR }}/ai-baselines/*/baseline.log
          if-no-files-found: ignore

  deployment:
    if: ${{ !inputs.business_only }}
    name: Linux · reverse-proxy deployment
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: API/SSE deployment, cancellation, rolling restart and traffic
        run: python3 scripts/deployment-trial.py --duration 30 --artifacts "$RUNNER_TEMP/daylily-deployment"
      - name: Preserve deployment evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deployment-Linux
          path: ${{ runner.temp }}/daylily-deployment
          if-no-files-found: ignore

  persistent-consumer:
    if: ${{ !inputs.business_only }}
    name: ${{ matrix.platform }} · persistent commerce consumer
    runs-on: ${{ matrix.runner }}
    container: ${{ matrix.container }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macOS
            runner: macos-26
            container: ''
            developer_directory: /Applications/Xcode_26.5.app/Contents/Developer
          - platform: Linux
            runner: ubuntu-24.04
            container: swift:6.3.2-noble
            developer_directory: ''
    defaults:
      run:
        shell: bash
    env:
      DEVELOPER_DIR: ${{ matrix.developer_directory }}
      SMOKE_SWIFT_VERSION: '6.3.2'
      RELEASE_VERSION: ${{ inputs.release_version }}
    steps:
      - name: Linux prerequisites
        if: matrix.platform == 'Linux'
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates curl git python3
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Exact-source persistent package and unit tests
        run: |
          echo "PERSISTENT_ARTIFACT_ROOT=$RUNNER_TEMP" >> "$GITHUB_ENV"
          if [[ "$RUNNER_OS" == Linux ]]; then
            git config --global --add safe.directory "$GITHUB_WORKSPACE"
          fi
          source_args=(--mode revision --repo-url "file://$GITHUB_WORKSPACE" --revision "$(git rev-parse HEAD)")
          if [[ -n "$RELEASE_VERSION" ]]; then source_args=(--mode release --version "$RELEASE_VERSION"); fi
          scripts/persistent-consumer-smoke-test.sh "${source_args[@]}" --workdir "$RUNNER_TEMP/persistent-consumer" --keep 2>&1 | tee "$RUNNER_TEMP/persistent-consumer.log"
          test -s "$RUNNER_TEMP/persistent-consumer/Package.resolved"
          test -s "$RUNNER_TEMP/persistent-consumer/dependency-record.json"
      - name: Preserve persistent dependency records
        if: always() && env.PERSISTENT_ARTIFACT_ROOT != ''
        uses: actions/upload-artifact@v4
        with:
          name: persistent-consumer-${{ matrix.platform }}
          path: |
            ${{ env.PERSISTENT_ARTIFACT_ROOT }}/persistent-consumer.log
            ${{ env.PERSISTENT_ARTIFACT_ROOT }}/persistent-consumer/Package.resolved
            ${{ env.PERSISTENT_ARTIFACT_ROOT }}/persistent-consumer/dependency-record.json
          if-no-files-found: ignore

  business-deployment:
    name: Linux · sustained persistent business
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    env:
      BUSINESS_TRIAL_SECONDS: ${{ inputs.business_trial_seconds || '60' }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Persistent API, verified TLS, SSE, failures and sustained traffic
        run: python3 scripts/sustained-deployment-trial.py --duration "$BUSINESS_TRIAL_SECONDS" --artifacts "$RUNNER_TEMP/daylily-business"
      - name: Preserve business deployment evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sustained-business-Linux
          path: ${{ runner.temp }}/daylily-business
          if-no-files-found: ignore
