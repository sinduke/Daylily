name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'ai/aidev/registry.yml'
  pull_request:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'ai/aidev/registry.yml'
  workflow_dispatch:
    inputs:
      release_version:
        description: Optional published version to validate with the complete current capability set
        required: false
        type: string

permissions:
  contents: read

jobs:
  validate:
    name: ${{ matrix.platform }} · Swift 6.3.2 · ${{ matrix.suite }}
    runs-on: ${{ matrix.runner }}
    container: ${{ matrix.container }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        platform: [macOS, Linux]
        suite: ${{ fromJSON(inputs.release_version && '["core","path","revision","legacy","release"]' || '["core","path","revision","legacy"]') }}
        include:
          - platform: macOS
            runner: macos-26
            container: ''
            developer_directory: /Applications/Xcode_26.5.app/Contents/Developer
          - platform: Linux
            runner: ubuntu-24.04
            container: swift:6.3.2-noble
            developer_directory: ''
    defaults:
      run:
        shell: bash
    env:
      DEVELOPER_DIR: ${{ matrix.developer_directory }}
      SMOKE_SWIFT_VERSION: '6.3.2'
      VALIDATION_SUITE: ${{ matrix.suite }}
      RELEASE_VERSION: ${{ inputs.release_version }}

    steps:
      - name: Install Linux smoke dependencies
        if: matrix.platform == 'Linux'
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates curl git python3

      - name: Checkout exact candidate
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify pinned toolchain and prerequisites
        run: |
          # Container steps run as root against a checkout owned by the host
          # runner. Checkout's temporary HOME does not configure later shells.
          if [[ "$RUNNER_OS" == Linux ]]; then
            git config --global --add safe.directory "$GITHUB_WORKSPACE"
          fi
          source scripts/smoke-common.sh
          SMOKE_ARTIFACT_DIR="$RUNNER_TEMP/daylily-smoke"
          echo "SMOKE_ARTIFACT_DIR=$SMOKE_ARTIFACT_DIR" >> "$GITHUB_ENV"
          mkdir -p "$SMOKE_ARTIFACT_DIR"
          smoke_require_tools curl
          swift --version > "$SMOKE_ARTIFACT_DIR/toolchain.txt"
          git rev-parse HEAD > "$SMOKE_ARTIFACT_DIR/candidate-revision.txt"

      - name: Build, test, and run checks
        if: matrix.suite == 'core'
        run: |
          swift package resolve
          swift build
          swift test
          swift run --skip-build HelloDaylily --check

      - name: Validate external packages
        if: matrix.suite != 'core'
        run: |
          case "$VALIDATION_SUITE" in
            path) source_args=(--mode path);;
            revision)
              # A Git URL checks SwiftPM source-control consumption of this exact
              # commit, including PR merge commits that have no published tag.
              source_args=(--mode revision --repo-url "file://$GITHUB_WORKSPACE" --revision "$(git rev-parse HEAD)")
              ;;
            legacy) source_args=(--mode release --version 0.1.0-alpha.1);;
            release) source_args=(--mode release --version "$RELEASE_VERSION");;
          esac
          profile=current
          if [[ "$VALIDATION_SUITE" == legacy ]]; then profile=legacy-alpha1; fi
          failed=0
          run_smoke() {
            local name="$1"
            shift
            "$@" --workdir "$SMOKE_ARTIFACT_DIR/$name" --keep 2>&1 | tee "$SMOKE_ARTIFACT_DIR/$name.log" || failed=1
          }
          run_smoke consumer scripts/consumer-smoke-test.sh "${source_args[@]}" --profile "$profile"
          run_smoke template scripts/template-smoke-test.sh "${source_args[@]}"
          if [[ "$VALIDATION_SUITE" != legacy ]]; then
            run_smoke commerce scripts/example-smoke-test.sh "${source_args[@]}"
            run_smoke openapi scripts/openapi-smoke-test.sh "${source_args[@]}"
          fi
          if [[ "$VALIDATION_SUITE" == path ]]; then
            run_smoke ai-exercises scripts/ai-exercises-smoke-test.sh --mode path
          fi
          exit "$failed"

      - name: Preserve resolver and smoke diagnostics
        if: always() && env.SMOKE_ARTIFACT_DIR != ''
        uses: actions/upload-artifact@v4
        with:
          name: validation-${{ matrix.platform }}-${{ matrix.suite }}
          path: |
            ${{ env.SMOKE_ARTIFACT_DIR }}/*.txt
            ${{ env.SMOKE_ARTIFACT_DIR }}/*.log
            ${{ env.SMOKE_ARTIFACT_DIR }}/*/Package.resolved
            ${{ env.SMOKE_ARTIFACT_DIR }}/*/dependency-record.json
            ${{ env.SMOKE_ARTIFACT_DIR }}/*/*.log
          if-no-files-found: ignore
